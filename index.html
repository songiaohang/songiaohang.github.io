<script src="https://unpkg.com/html5-qrcode"></script>


<script>

/* =====================================================
   URL APPS SCRIPT
   ===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyxajh4k-Ed_XXqIjd2OlsMSQ2wy7DSbhpOTIMGKLZezb5eOEJ_2i7qxORnggZmBXqbVg/exec";


/* =====================================================
   BIEN
   ===================================================== */

let html5QrCode = null;

let dangChay = false;

let daQuet = false;

let anhBase64 = "";

let maQRHienTai = "";

let hanhDongHienTai = "";

let maNhanVien = "";

let tenNhanVien = "";

let audioContext = null;


/* =====================================================
   TIENG BIP
   ===================================================== */

function taoTiengBip(
    tanSo,
    thoiGian,
    amLuong
) {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = "square";

        oscillator.frequency.value =
            tanSo;

        gain.gain.value =
            amLuong;

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            thoiGian
        );

    }
    catch(e) {

        console.log(
            "Khong phat duoc tieng bip:",
            e
        );

    }

}


function bipQuetQR() {

    taoTiengBip(
        1000,
        0.35,
        0.8
    );

}


function bipChupAnh() {

    taoTiengBip(
        1500,
        0.20,
        0.8
    );

}


/* =====================================================
   DANG NHAP
   ===================================================== */

function dangNhap() {

    const ma =
        document.getElementById(
            "maNV"
        ).value.trim();

    const mk =
        document.getElementById(
            "matKhau"
        ).value.trim();

    if (!ma || !mk) {

        document.getElementById(
            "baoDangNhap"
        ).innerHTML =
            "Hay nhap ma nhan vien va mat khau";

        return;

    }


    document.getElementById(
        "baoDangNhap"
    ).innerHTML =
        "Dang dang nhap...";


    /* Lay thong tin dang nhap
       qua GET Apps Script */

    fetch(
        APPS_SCRIPT_URL +
        "?action=dangNhap" +
        "&maNV=" +
        encodeURIComponent(ma) +
        "&matKhau=" +
        encodeURIComponent(mk)
    )

    .then(function(response) {

        return response.json();

    })

    .then(function(kq) {

        if (!kq || !kq.ok) {

            document.getElementById(
                "baoDangNhap"
            ).innerHTML =
                kq && kq.msg
                ? kq.msg
                : "Dang nhap that bai";

            return;

        }

        maNhanVien =
            kq.maNV;

        tenNhanVien =
            kq.tenNV;

        document.getElementById(
            "manHinhDangNhap"
        ).classList.add("an");

        document.getElementById(
            "manHinhChinh"
        ).classList.remove("an");

        document.getElementById(
            "thongTinNV"
        ).innerHTML =
            "Nhan vien: <b>" +
            tenNhanVien +
            "</b> (" +
            maNhanVien +
            ")";

    })

    .catch(function(err) {

        document.getElementById(
            "baoDangNhap"
        ).innerHTML =
            "Loi ket noi: " +
            err;

    });

}


/* =====================================================
   BAT DAU QUET
   ===================================================== */

function batDauQuet(
    hanhDong
) {

    hanhDongHienTai =
        hanhDong;

    maQRHienTai = "";

    anhBase64 = "";

    daQuet = false;

    document.getElementById(
        "manHinhChinh"
    ).classList.add("an");

    document.getElementById(
        "manHinhDon"
    ).classList.add("an");

    document.getElementById(
        "manHinhCamera"
    ).classList.remove("an");

    document.getElementById(
        "maQR"
    ).innerText =
        "Chua quet";

    document.getElementById(
        "anhChup"
    ).src = "";

    document.getElementById(
        "anhChup"
    ).style.display =
        "none";

    document.getElementById(
        "nhanAnh"
    ).style.display =
        "none";

    moCamera();

}


/* =====================================================
   MO CAMERA
   GIU NGUYEN CODE CAMERA DANG CHAY TOT
   ===================================================== */

function moCamera() {

    if (dangChay) {

        return;

    }

    daQuet = false;

    document.getElementById(
        "trangThai"
    ).innerHTML =
        "Dang tim camera...";


    Html5Qrcode.getCameras()

    .then(function(cameras) {

        if (
            !cameras ||
            cameras.length === 0
        ) {

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Khong tim thay camera";

            return;

        }


        let cameraId =
            cameras[0].id;


        /* Uu tien camera sau */

        for (
            let i = 0;
            i < cameras.length;
            i++
        ) {

            let ten =
                (
                    cameras[i].label ||
                    ""
                ).toLowerCase();


            if (
                ten.includes("back") ||
                ten.includes("rear") ||
                ten.includes("environment") ||
                ten.includes("sau")
            ) {

                cameraId =
                    cameras[i].id;

                break;

            }

        }


        html5QrCode =
            new Html5Qrcode(
                "reader"
            );


        const cauHinh = {

            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }

        };


        html5QrCode.start(

            cameraId,

            cauHinh,

            function(maQR) {

                xuLyQR(maQR);

            },

            function(loi) {

                /* Bo qua loi quet */

            }

        )

        .then(function() {

            dangChay = true;

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Camera dang hoat dong - dua QR vao khung";

        })

        .catch(function(err) {

            dangChay = false;

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Khong mo duoc camera";

            document.getElementById(
                "ketQua"
            ).innerHTML =
                String(err);

        });

    })

    .catch(function(err) {

        document.getElementById(
            "trangThai"
        ).innerHTML =
            "Khong duoc phep truy cap camera";

        document.getElementById(
            "ketQua"
        ).innerHTML =
            String(err);

    });

}


/* =====================================================
   XU LY QR
   ===================================================== */

function xuLyQR(maQR) {

    if (daQuet) {

        return;

    }

    daQuet = true;

    maQR =
        String(maQR).trim();

    maQRHienTai =
        maQR;


    bipQuetQR();


    document.getElementById(
        "maQR"
    ).innerText =
        maQR;

    document.getElementById(
        "trangThai"
    ).innerHTML =
        "Da quet QR - dang tu dong chup anh...";

    document.getElementById(
        "ketQua"
    ).innerHTML =
        "Ma QR: " +
        maQR;


    setTimeout(function() {

        chupAnhTuCamera(
            function(anh) {

                if (anh) {

                    anhBase64 =
                        anh;

                    bipChupAnh();

                    document.getElementById(
                        "anhChup"
                    ).src =
                        anh;

                    document.getElementById(
                        "anhChup"
                    ).style.display =
                        "block";

                    document.getElementById(
                        "nhanAnh"
                    ).style.display =
                        "block";

                    document.getElementById(
                        "trangThai"
                    ).innerHTML =
                        "Da quet QR va chup anh thanh cong";

                    document.getElementById(
                        "ketQua"
                    ).innerHTML =
                        "Ma QR: " +
                        maQR +
                        "<br>Anh da duoc chup.";

                }

                else {

                    document.getElementById(
                        "trangThai"
                    ).innerHTML =
                        "Quet QR thanh cong nhung khong chup duoc anh";

                }


                dungCamera();

                /* Sau khi chup xong
                   tim don */

                timDonSauKhiQuet();

            });

    }, 300);

}


/* =====================================================
   CHUP ANH
   ===================================================== */

function chupAnhTuCamera(
    callback
) {

    const reader =
        document.getElementById(
            "reader"
        );

    const video =
        reader.querySelector(
            "video"
        );


    if (!video) {

        callback("");

        return;

    }


    if (
        video.readyState <
        HTMLMediaElement.HAVE_CURRENT_DATA
    ) {

        setTimeout(function() {

            chupAnhTuCamera(
                callback
            );

        }, 300);

        return;

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    let width =
        video.videoWidth;

    let height =
        video.videoHeight;


    if (!width || !height) {

        callback("");

        return;

    }


    const maxWidth = 1280;


    if (width > maxWidth) {

        const tyLe =
            maxWidth / width;

        width =
            maxWidth;

        height =
            Math.round(
                height * tyLe
            );

    }


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );


    anhBase64 =
        canvas.toDataURL(
            "image/jpeg",
            0.75
        );


    callback(
        anhBase64
    );

}


/* =====================================================
   DUNG CAMERA
   ===================================================== */

function dungCamera() {

    if (
        !html5QrCode ||
        !dangChay
    ) {

        return;

    }


    html5QrCode.stop()

    .then(function() {

        try {

            html5QrCode.clear();

        }

        catch(e) {

            console.log(e);

        }


        dangChay = false;

    })

    .catch(function(err) {

        console.log(err);

        dangChay = false;

    });

}


/* =====================================================
   TIM DON SAU KHI QUET
   ===================================================== */

function timDonSauKhiQuet() {

    document.getElementById(
        "trangThai"
    ).innerHTML =
        "Dang tim don hang...";


    fetch(
        APPS_SCRIPT_URL +
        "?action=timDon" +
        "&maQR=" +
        encodeURIComponent(
            maQRHienTai
        )
    )

    .then(function(response) {

        return response.json();

    })

    .then(function(kq) {

        if (!kq || !kq.ok) {

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Khong tim thay don";

            document.getElementById(
                "ketQua"
            ).innerHTML =
                kq && kq.msg
                ? kq.msg
                : "Khong tim thay don hang";

            return;

        }


        hienThiDon(kq);

    })

    .catch(function(err) {

        document.getElementById(
            "trangThai"
        ).innerHTML =
            "Loi ket noi Apps Script";

        document.getElementById(
            "ketQua"
        ).innerHTML =
            String(err);

    });

}


/* =====================================================
   HIEN DON
   ===================================================== */

function hienThiDon(don) {

    document.getElementById(
        "manHinhCamera"
    ).classList.add("an");

    document.getElementById(
        "manHinhDon"
    ).classList.remove("an");


    let html = "";

    html +=
        '<div class="thong-tin">';

    html +=
        '<div class="dong"><b>Ma QR:</b> ' +
        don.maQR +
        '</div>';

    html +=
        '<div class="dong"><b>Ma don:</b> ' +
        don.maDon +
        '</div>';

    html +=
        '<div class="dong"><b>Khach hang:</b> ' +
        don.khachHang +
        '</div>';

    html +=
        '<div class="dong"><b>So dien thoai:</b> ' +
        don.soDienThoai +
        '</div>';

    html +=
        '<div class="dong"><b>Dia chi:</b> ' +
        don.diaChi +
        '</div>';

    html +=
        '<div class="dong"><b>Ten hang:</b> ' +
        don.tenHang +
        '</div>';

    html +=
        '<div class="dong"><b>So luong:</b> ' +
        don.soLuong +
        '</div>';

    html +=
        '<div class="dong"><b>Tien hang:</b> ' +
        dinhDangTien(don.tienHang) +
        '</div>';

    html +=
        '<div class="dong"><b>Tien ship:</b> ' +
        dinhDangTien(don.tienShip) +
        '</div>';

    html +=
        '<div class="dong"><b>Tong tien:</b> ' +
        dinhDangTien(don.tongTien) +
        '</div>';

    html +=
        '<div class="dong"><b>Ton kho:</b> ' +
        don.tonKho +
        '</div>';

    html +=
        '<div class="dong"><b>Trang thai:</b> ' +
        don.trangThai +
        '</div>';

    html +=
        '</div>';


    document.getElementById(
        "thongTinDon"
    ).innerHTML =
        html;


    if (
        hanhDongHienTai ===
        "NHAN"
    ) {

        xuLyNhan();

    }

    else if (
        hanhDongHienTai ===
        "GIAO"
    ) {

        xuLyGiao();

    }

    else if (
        hanhDongHienTai ===
        "HOAN"
    ) {

        xuLyHoan();

    }

    else if (
        hanhDongHienTai ===
        "KHO"
    ) {

        xuLyKho();

    }

}


/* =====================================================
   NHAN HANG
   ===================================================== */

    document.getElementById(

    ).innerHTML =

        '<div class="trang-thai">' +

        '</div>' +

        '<button class="xanh" ' +
        'onclick="xacNhanNhan()">' +

}

function xacNhanHoan() {

    let lyDo =
        document.getElementById(
            "lyDoHoan"
        ).value;

    const lyDoKhac =
        document.getElementById(
            "lyDoKhac"
        ).value.trim();


    if (
        lyDo === "KHAC" &&
        lyDoKhac
    ) {

        lyDo =
            "KHAC: " +
            lyDoKhac;

    }


    guiDuLieu({

        hanhDong:
            "HOAN",

        maQR:
            maQRHienTai,

        maNV:
            maNhanVien,

        lyDo:
            lyDo,

        anhBase64:
            anhBase64

    });

}

   NHAP LAI KHO
   ===================================================== */

        '<div class="nhom">' +

        '</div>' +

        '</button>' +

}


function xacNhanKho() {

    guiDuLieu({

        hanhDong:
            "KHO",

        maNV:

            ""

    });

}


/* =====================================================
   GUI DU LIEU POST
   ===================================================== */

function guiDuLieu(
    duLieu
) {

    document.getElementById(
        "khuXuLy"
    ).innerHTML =
        '<div class="loading">' +
        'Dang cap nhat du lieu...' +
        '</div>';


    fetch(
        APPS_SCRIPT_URL,
        {

            method: "POST",

            body:
                JSON.stringify(
                    duLieu
                )

        }
    )

    .then(function(response) {

        return response.json();

    })

    .then(function(kq) {

        if (!kq || !kq.ok) {

            document.getElementById(
                "khuXuLy"
            ).innerHTML =

                '<div class="trang-thai thanh-loi">' +

                (
                    kq && kq.msg
                    ? kq.msg
                    : "Cap nhat that bai"
                ) +

                '</div>';

            return;

        }


        let html =
            '<div class="trang-thai thanh-ok">' +

            '<b>' +
            (
                kq.msg ||
                "Cap nhat thanh cong"
            ) +
            '</b>';


        if (
            kq.tonKho !== undefined
        ) {

            html +=
                '<br>Ton kho: ' +
                kq.tonKho;

        }


        html +=
            '</div>';


        document.getElementById(
            "khuXuLy"
        ).innerHTML =
            html +

            '<button class="xanh" ' +
            'onclick="veTrangChinh()">' +

            'VE MAN HINH CHINH' +

            '</button>';

    })

    .catch(function(err) {

        document.getElementById(
            "khuXuLy"
        ).innerHTML =

            '<div class="trang-thai thanh-loi">' +

            'Loi ket noi: ' +

            String(err) +

            '</div>';

    });

}


/* =====================================================
   CHUP LAI
   ===================================================== */

function chupLai() {

    if (!maQRHienTai) {

        alert(
            "Chua co ma QR"
        );

        return;

    }


    document.getElementById(
        "trangThai"
    ).innerHTML =
        "Dang mo camera de chup lai...";


    daQuet = true;

    moCameraChoChupLai();

}


/* =====================================================
   CAMERA CHUP LAI
   ===================================================== */

function moCameraChoChupLai() {

    if (dangChay) {

        return;

    }


    Html5Qrcode.getCameras()

    .then(function(cameras) {

        if (
            !cameras ||
            cameras.length === 0
        ) {

            alert(
                "Khong tim thay camera"
            );

            return;

        }


        let cameraId =
            cameras[0].id;


        for (
            let i = 0;
            i < cameras.length;
            i++
        ) {

            let ten =
                (
                    cameras[i].label ||
                    ""
                ).toLowerCase();


            if (
                ten.includes("back") ||
                ten.includes("rear") ||
                ten.includes("environment") ||
                ten.includes("sau")
            ) {

                cameraId =
                    cameras[i].id;

                break;

            }

        }


        html5QrCode =
            new Html5Qrcode(
                "reader"
            );


        html5QrCode.start(

            cameraId,

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }
            },

            function() {},

            function() {}

        )

        .then(function() {

            dangChay = true;

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Camera dang hoat dong - dua may vao kien hang";


            setTimeout(function() {

                chupAnhTuCamera(
                    function(anh) {

                        if (anh) {

                            anhBase64 =
                                anh;

                            bipChupAnh();

                            document.getElementById(
                                "anhChup"
                            ).src =
                                anh;

                            document.getElementById(
                                "anhChup"
                            ).style.display =
                                "block";

                            document.getElementById(
                                "nhanAnh"
                            ).style.display =
                                "block";

                            document.getElementById(
                                "trangThai"
                            ).innerHTML =
                                "Da chup lai anh";

                        }


                        dungCamera();

                    });

            }, 1000);

        })

        .catch(function(err) {

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Khong mo duoc camera";

            console.log(err);

        });

    })

    .catch(function(err) {

        console.log(err);

    });

}


/* =====================================================
   QUET MOI
   ===================================================== */

function quetMoi() {

    dungCamera();

    maQRHienTai = "";

    anhBase64 = "";

    daQuet = false;


    document.getElementById(
        "maQR"
    ).innerText =
        "Chua quet";


    document.getElementById(
        "anhChup"
    ).src = "";

    document.getElementById(
        "anhChup"
    ).style.display =
        "none";


    document.getElementById(
        "nhanAnh"
    ).style.display =
        "none";


    document.getElementById(
        "ketQua"
    ).innerHTML =
        "Hay dua ma QR vao khung camera";


    document.getElementById(
        "trangThai"
    ).innerHTML =
        "San sang quet QR";


    moCamera();

}


/* =====================================================
   VE TRANG CHINH
   ===================================================== */

function veTrangChinh() {

    dungCamera();

    document.getElementById(
        "manHinhDon"
    ).classList.add("an");

    document.getElementById(
        "manHinhCamera"
    ).classList.add("an");

    document.getElementById(
        "manHinhChinh"
    ).classList.remove("an");


    maQRHienTai = "";

    anhBase64 = "";

    daQuet = false;

}


/* =====================================================
   DUNG CAMERA VA VE TRANG CHINH
   ===================================================== */

function dungCameraVaVeTrangChinh() {

    dungCamera();

    veTrangChinh();

}

function dinhDangTien(so) {

    const n =
        Number(so);

    if (isNaN(n)) {

        return so || "";

    }

    return n.toLocaleString(
        "vi-VN"
    ) +
    " VND";

}


/* =====================================================
   DANG XUAT
   ===================================================== */

function dangXuat() {

    dungCamera();

    maNhanVien = "";

    tenNhanVien = "";

    maQRHienTai = "";

    anhBase64 = "";

    daQuet = false;


    document.getElementById(
        "manHinhChinh"
    ).classList.add("an");

    document.getElementById(
        "manHinhDon"
    ).classList.add("an");

    document.getElementById(
        "manHinhCamera"
    ).classList.add("an");

    document.getElementById(
        "manHinhDangNhap"
    ).classList.remove("an");


    document.getElementById(
        "maNV"
    ).value = "";

    document.getElementById(
        "matKhau"
    ).value = "";

    document.getElementById(
        "baoDangNhap"
    ).innerHTML =
        "Hay dang nhap";

}
