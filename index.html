<script>


// =======================================================

const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbxeQSO_DE18GmlRidLJNF4oMs4T7bQ2u1SyERrHtQgJm2cPgkickHyKxh_AbmI0k-Fi8w/exec";

let maQRHienTai = "";

let anhBase64 = "";

let maNVDangNhap = "";

let tenNVDangNhap = "";

let nghiepVuHienTai = "";

let donHienTai = null;

let dangXuLy = false;

let audioContext = null;


// =======================================================
// TIENG BIP
// =======================================================

function taoTiengBip(
    tanSo,
    thoiGian,
    amLuong
) {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            "square";

        oscillator.frequency.value =
            tanSo;

        gain.gain.value =
            amLuong;

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            thoiGian
        );

    } catch (e) {

        console.log(
            "Khong phat duoc tieng bip:",
            e
        );

    }

}


// =======================================================
// BIP QUET QR
// =======================================================

function bipQuetQR() {

    taoTiengBip(
        1000,
        0.35,
        0.8
    );

}


// =======================================================
// BIP CHUP ANH
// =======================================================

function bipChupAnh() {

    taoTiengBip(
        1500,
        0.20,
        0.8
    );

}


// =======================================================
// DANG NHAP
// =======================================================

function dangNhapHeThong() {

    const maNV =
        document
        .getElementById("maNV")
        .value
        .trim();

    const matKhau =
        document
        .getElementById("matKhau")
        .value
        .trim();


    if (!maNV) {

        hienLoiDangNhap(
            "Hay nhap ma nhan vien."
        );

        return;

    }


    if (!matKhau) {

        hienLoiDangNhap(
            "Hay nhap mat khau."
        );

        return;

    }


    hienLoiDangNhap(
        "Dang kiem tra..."
    );


    goiJSONP(
        "dangNhap",
        {
            maNV: maNV,
            matKhau: matKhau
        },
        function(kq) {

            if (
                kq &&
                kq.ok
            ) {

                maNVDangNhap =
                    kq.maNV;

                tenNVDangNhap =
                    kq.tenNV;


                document
                    .getElementById(
                        "hienMaNV"
                    )
                    .innerText =
                    maNVDangNhap;


                document
                    .getElementById(
                        "hienTenNV"
                    )
                    .innerText =
                    tenNVDangNhap;


                document
                    .getElementById(
                        "manHinhDangNhap"
                    )
                    .style.display =
                    "none";


                document
                    .getElementById(
                        "manHinhChinh"
                    )
                    .style.display =
                    "block";


                hienLoiDangNhap("");

            } else {

                hienLoiDangNhap(
                    kq && kq.msg
                        ? kq.msg
                        : "Dang nhap that bai."
                );

            }

        }
    );

}


// =======================================================
// JSONP
// =======================================================

function goiJSONP(
    action,
    thamSo,
    callback
) {

    const tenCallback =
        "callback_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random() * 10000
        );


    thamSo.action =
        action;

    thamSo.callback =
        tenCallback;


    window[tenCallback] =
        function(data) {

            try {

                callback(data);

            } finally {

                delete window[
                    tenCallback
                ];

                if (
                    script &&
                    script.parentNode
                ) {

                    script.parentNode
                        .removeChild(
                            script
                        );

                }

            }

        };


    const script =
        document.createElement(
            "script"
        );


    let url =
        URL_APPS_SCRIPT +
        "?";


    const danhSach =
        [];


    for (
        const key in thamSo
    ) {

        danhSach.push(
            encodeURIComponent(key) +
            "=" +
            encodeURIComponent(
                thamSo[key]
            )
        );

    }


    url += danhSach.join("&");


    script.src = url;

    script.onerror =
        function() {

            callback({
                ok: false,
                msg: "Khong ket noi duoc may chu."
            });

        };


    document.body.appendChild(
        script
    );

}

            "ketQuaQR"

    if (
        nghiepVu ===
        "nhanHang"
    ) {

        document
            .getElementById(
                "tenNghiepVu"
            )
            .innerText =
            "NHAN HANG TU KHO";

    }


    if (
        nghiepVu ===
        "giaoHang"
    ) {

        document
            .getElementById(
                "tenNghiepVu"
            )
            .innerText =
            "GIAO HANG CHO KHACH";

    }


    if (
        nghiepVu ===
        "hangHoan"
    ) {

        document
            .getElementById(
                "tenNghiepVu"
            )
            .innerText =
            "HANG HOAN";

    }


    if (
        nghiepVu ===
        "nhapLaiKho"
    ) {

        document
            .getElementById(
                "tenNghiepVu"
            )
            .innerText =
            "NHAP LAI KHO";

    }


    khoiDongCamera();

}


// =======================================================
// KHOI DONG CAMERA
// =======================================================

async function khoiDongCamera() {

    dangXuLy =
        false;


    document
        .getElementById(
            "trangThai"
        )
        .innerText =
        "Dang tim camera sau...";


    try {

        if (
            !html5QrCode
        ) {

            html5QrCode =
                new Html5Qrcode(
                    "reader"
                );

        }


        const cameras =
            await Html5Qrcode
                .getCameras();


        if (
            !cameras ||
            cameras.length === 0
        ) {

            throw new Error(
                "Khong tim thay camera."
            );

        }


        let cameraSau =
            cameras.find(
                camera =>
                    /back|rear|environment/i
                    .test(
                        camera.label
                    )
            );


        if (!cameraSau) {

            cameraSau =
                cameras[
                    cameras.length - 1
                ];

        }


        await html5QrCode.start(

            cameraSau.id,

            {
                fps: 10,

                qrbox:
                    function(
                        viewfinderWidth,
                        viewfinderHeight
                    ) {

                        const kichThuoc =
                            Math.min(
                                viewfinderWidth,
                                viewfinderHeight
                            ) * 0.70;

                        return {
                            width:
                                kichThuoc,
                            height:
                                kichThuoc
                        };

                    },

                aspectRatio: 1.0
            },

            khiQuetThanhCong,

            function() {}

        );


        document
            .getElementById(
                "trangThai"
            )
            .innerText =
            "Camera san sang - Dua QR vao khung";


    } catch (error) {

        console.error(error);

        document
            .getElementById(
                "trangThai"
            )
            .innerText =
            "LOI CAMERA: " +
            error.message;

    }

}


// =======================================================
// QUET QR THANH CONG
// =======================================================

async function khiQuetThanhCong(
    maQR
) {

    if (dangXuLy) {

        return;

    }


    dangXuLy =
        true;


    maQR =
        String(maQR)
        .trim();


    maQRHienTai =
        maQR;


    // BIP
    bipQuetQR();


    document
        .getElementById(
            "ketQuaQR"
        )
        .innerText =
        "MA QR: " +
        maQR;


    document
        .getElementById(
            "trangThai"
        )
        .innerText =
        "Da quet QR - Dang tim don...";


    // DUNG CAMERA
    try {

        await html5QrCode.stop();

    } catch (e) {

        console.log(e);

    }


    // TIM DON
    goiJSONP(
        "timDon",
        {
            maQR: maQR
        },
        function(kq) {

            if (
                !kq ||
                !kq.ok
            ) {

                document
                    .getElementById(
                        "trangThai"
                    )
                    .innerText =
                    kq && kq.msg
                        ? kq.msg
                        : "Khong tim thay don.";

                dangXuLy =
                    false;

                return;

            }


            donHienTai =
                kq;


            hienThiDon(
                kq
            );


            document
                .getElementById(
                    "trangThai"
                )
                .innerText =
                "Tim thay don - Dang tu dong chup anh...";


            setTimeout(
                function() {

                    chupAnhTuCamera();

                },
                500
            );

        }
    );

}

        "giaoHang"

        document

    }


    if (
        nghiepVuHienTai ===
        "hangHoan"
    ) {

        document
            .getElementById(
                "phanHangHoan"
            )
            .classList.remove(
                "an"
            );

    }

}


// =======================================================
// DINH DANG TIEN
// =======================================================

function dinhDangTien(
    soTien
) {

    const so =
        Number(soTien) || 0;

    return so.toLocaleString(
        "vi-VN"
    ) + " d";


}


// =======================================================
// CHUP ANH
// =======================================================

function chupAnhTuCamera() {

    try {

        const reader =
            document.getElementById(
                "reader"
            );


        const video =
            reader.querySelector(
                "video"
            );


        if (!video) {

            throw new Error(
                "Khong tim thay video camera."
            );

        }


        const canvas =
            document.createElement(
                "canvas"
            );


        let chieuRong =
            video.videoWidth;

        let chieuCao =
            video.videoHeight;


        const maxWidth =
            1000;


        if (
            chieuRong >
            maxWidth
        ) {

            const tyLe =
                maxWidth /
                chieuRong;

            chieuRong =
                maxWidth;

            chieuCao =
                chieuCao * tyLe;

        }


        canvas.width =
            chieuRong;

        canvas.height =
            chieuCao;


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.drawImage(
            video,
            0,
            0,
            chieuRong,
            chieuCao
        );


        const anh =
            canvas.toDataURL(
                "image/jpeg",
                0.70
            );


        if (!anh) {

            throw new Error(
                "Khong tao duoc anh."
            );

        }


        anhBase64 =
            anh;


        // BIP CHUP ANH
        bipChupAnh();


        const img =
            document.getElementById(
                "anhPreview"
            );


        img.src =
            anhBase64;


        img.style.display =
            "block";


        document
            .getElementById(
                "btnChupLai"
            )
            .classList.remove(
                "an"
            );


        document
            .getElementById(
                "trangThai"
            )
            .innerText =
            "Da chup anh thanh cong.";

    } catch (error) {

        console.error(error);

        document
            .getElementById(
                "trangThai"
            )
            .innerText =
            "LOI CHUP ANH: " +
            error.message;

        dangXuLy =
            false;

    }

}


// =======================================================
// CHUP LAI
// =======================================================

async function chupLaiAnh() {

    dangXuLy =
        false;


    document
        .getElementById(
            "anhPreview"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "btnChupLai"
        )
        .classList.add(
            "an"
        );


    document
        .getElementById(
            "trangThai"
        )
        .innerText =
        "Dang mo camera...";


    try {

        await html5QrCode.start(

            {
                facingMode:
                    "environment"
            },

            {
                fps: 10,

                qrbox:
                    function(
                        viewfinderWidth,
                        viewfinderHeight
                    ) {

                        const kichThuoc =
                            Math.min(
                                viewfinderWidth,
                                viewfinderHeight
                            ) * 0.70;

                        return {
                            width:
                                kichThuoc,
                            height:
                                kichThuoc
                        };

                    },

                aspectRatio: 1.0
            },

            function() {},

            function() {}

        );


        // Khi bam chup lai,
        // camera mo ra nhung khong doi QR.
        // Tao nut chup lai bang cach lay frame sau 1 giay.

        setTimeout(
            function() {

                chupAnhTuCamera();

            },
            1000
        );


    } catch (error) {

        console.error(error);

        document
            .getElementById(
                "trangThai"
            )
            .innerText =
            "LOI CAMERA: " +
            error.message;

    }

}


// =======================================================
// THUC HIEN NGHIEP VU
// =======================================================

function thucHienNghiepVu() {

    if (!maQRHienTai) {

        alert(
            "Chua co ma QR."
        );

        return;

    }


    if (!maNVDangNhap) {

        alert(
            "Chua dang nhap."
        );

        return;

    }


    if (
        nghiepVuHienTai !==
        "nhapLaiKho" &&
        !anhBase64
    ) {

        alert(
            "Chua co anh kien hang."
        );

        return;

    }


    const btn =
        document.getElementById(
            "btnThucHien"
        );


    btn.disabled =
        true;


    btn.innerText =
        "DANG GUI DU LIEU...";


    // -----------------------------------------------
    // NHAN HANG
    // -----------------------------------------------

    if (
        nghiepVuHienTai ===
        "nhanHang"
    ) {

        guiFormPOST(
            "nhanHang",
            {
                maQR:
                    maQRHienTai,

                maNV:
                    maNVDangNhap,

                anhBase64:
                    anhBase64
            }
        );


        return;

    }


    // -----------------------------------------------
    // GIAO HANG
    // -----------------------------------------------

    if (
        nghiepVuHienTai ===
        "giaoHang"
    ) {

        const thanhToanHang =
            document
            .getElementById(
                "thanhToanHang"
            )
            .value;


        const phuongThucHang =
            document
            .getElementById(
                "phuongThucHang"
            )
            .value;


        const thanhToanShip =
            document
            .getElementById(
                "thanhToanShip"
            )
            .value;


        const phuongThucShip =
            document
            .getElementById(
                "phuongThucShip"
            )
            .value;


        if (
            !thanhToanHang ||
            !phuongThucHang ||
            !thanhToanShip ||
            !phuongThucShip
        ) {

            alert(
                "Hay chon day du thong tin thanh toan."
            );


            btn.disabled =
                false;

            btn.innerText =
                "THUC HIEN";

            return;

        }


        guiFormPOST(
            "giaoHang",
            {
                maQR:
                    maQRHienTai,

                maNV:
                    maNVDangNhap,

                thanhToanHang:
                    thanhToanHang,

                phuongThucHang:
                    phuongThucHang,

                thanhToanShip:
                    thanhToanShip,

                phuongThucShip:
                    phuongThucShip,

                anhBase64:
                    anhBase64
            }
        );


        return;

    }


    // -----------------------------------------------
    // HANG HOAN
    // -----------------------------------------------

    if (
        nghiepVuHienTai ===
        "hangHoan"
    ) {

        const lyDo =
            document
            .getElementById(
                "lyDoHoan"
            )
            .value;


        if (!lyDo) {

            alert(
                "Hay chon ly do hang hoan."
            );


            btn.disabled =
                false;

            btn.innerText =
                "THUC HIEN";

            return;

        }


        guiFormPOST(
            "hangHoan",
            {
                maQR:
                    maQRHienTai,

                maNV:
                    maNVDangNhap,

                lyDo:
                    lyDo,

                anhBase64:
                    anhBase64
            }
        );


        return;

    }


    // -----------------------------------------------
    // NHAP LAI KHO
    // -----------------------------------------------

    if (
        nghiepVuHienTai ===
        "nhapLaiKho"
    ) {

        guiFormPOST(
            "nhapLaiKho",
            {
                maQR:
                    maQRHienTai,

                maNV:
                    maNVDangNhap
            }
        );

    }

}


// =======================================================
// GUI FORM POST
// KHONG DUNG FETCH
// =======================================================

function guiFormPOST(
    action,
    duLieu
) {

    const iframe =
        document.createElement(
            "iframe"
        );


    iframe.name =
        "iframeGuiDuLieu_" +
        Date.now();


    iframe.style.display =
        "none";


    document.body.appendChild(
        iframe
    );


    const form =
        document.createElement(
            "form"
        );


    form.method =
        "POST";


    form.action =
        URL_APPS_SCRIPT;


    form.target =
        iframe.name;


    form.style.display =
        "none";


    // ACTION
    themInput(
        form,
        "action",
        action
    );


    // DU LIEU
    for (
        const key in duLieu
    ) {

        themInput(
            form,
            key,
            duLieu[key]
        );

    }


    document.body.appendChild(
        form
    );


    form.submit();


    // Thong bao cho nguoi dung
    setTimeout(
        function() {

            document
                .getElementById(
                    "trangThai"
                )
                .innerText =
                "Da gui yeu cau len may chu.";


            alert(
                "Da gui yeu cau. Vui long kiem tra Google Sheets."
            );


            btnVeLai();

        },
        1800
    );

}


// =======================================================
// THEM INPUT
// =======================================================

function themInput(
    form,
    ten,
    giaTri
) {

    const input =
        document.createElement(
            "input"
        );

    input.type =
        "hidden";

    input.name =
        ten;

    input.value =
        giaTri || "";

    form.appendChild(
        input
    );

}


// =======================================================
// QUAY LAI MAN HINH CHINH
// =======================================================

function veManHinhChinh() {

    dungCamera();

    document
        .getElementById(
            "manHinhQuet"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "manHinhChinh"
        )
        .style.display =
        "block";


    resetDuLieu();

}


// =======================================================
// DUNG CAMERA
// =======================================================

async function dungCamera() {

    try {

        if (
            html5QrCode
        ) {

            const state =
                html5QrCode
                    .getState();

            if (
                state ===
                2 ||
                state ===
                3
            ) {

                await html5QrCode.stop();

            }

        }

    } catch (e) {

        console.log(e);

    }

}

// RESET

    maQRHienTai =

    anhBase64 =

    document
        .getElementById(

        )
        .classList.add(

        );


    document
        .getElementById(

        .classList.add(

    const btn =

// =======================================================

// =======================================================

function btnVeLai() {

            "manHinhQuet"

// =======================================================
// DANG XUAT
// =======================================================

function dangXuat() {

    dungCamera();


    maNVDangNhap =
        "";

    tenNVDangNhap =
        "";


    document
        .getElementById(
            "maNV"
        )
        .value =
        "";

    document
        .getElementById(
            "matKhau"
        )
        .value =
        "";


    document
        .getElementById(
            "manHinhChinh"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "manHinhQuet"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "manHinhDangNhap"
        )
        .style.display =
        "block";

}
