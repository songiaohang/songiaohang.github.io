
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Giao Nhan QR</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 15px;
    text-align: center;
    background: #f2f2f2;
}

h2 {
    margin-top: 5px;
}

#reader {
    width: 100%;
    max-width: 500px;
    margin: auto;
    background: white;
}

#anhXem {
    width: 100%;
    max-width: 500px;
    margin-top: 15px;
    display: none;
}

button {
    width: 90%;
    max-width: 400px;
    padding: 14px;
    margin: 8px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    background: #333;
    color: white;
}

#thongBao {
    margin: 10px;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>

<h2>GIAO NHAN QR</h2>

<div id="thongBao">
    Dang khoi dong camera...
</div>

<div id="reader"></div>

<img id="anhXem">

<br>

<button onclick="chupLai()">
    CHUP LAI
</button>

<button onclick="quetMoi()">
    QUET QR MOI
</button>

<script>

let html5QrCode = null;

let daQuet = false;

let maQRHienTai = "";

let anhBase64 = "";

let audioContext = null;


/* =========================
   TAO TIENG BIP
========================= */

function taoTiengBip(tanSo, thoiGian, amLuong) {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (audioContext.state === "suspended") {

            audioContext.resume();

        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = "square";

        oscillator.frequency.value = tanSo;

        gain.gain.value = amLuong;

        oscillator.connect(gain);

        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + thoiGian
        );

    } catch(e) {

        console.log(
            "Khong phat duoc tieng bip:",
            e
        );

    }

}


/* BIP KHI QUET QR */

function bipQuetQR() {

    taoTiengBip(
        1000,
        0.35,
        0.8
    );

}


/* BIP KHI CHUP ANH */

function bipChupAnh() {

    taoTiengBip(
        1500,
        0.20,
        0.8
    );

}


/* =========================
   MO CAMERA
========================= */

async function moCamera() {

    try {

        document.getElementById(
            "thongBao"
        ).innerText =
            "Dang mo camera...";

        html5QrCode =
            new Html5Qrcode("reader");


        const cameras =
            await Html5Qrcode.getCameras();


        if (!cameras || cameras.length === 0) {

            throw new Error(
                "Khong tim thay camera"
            );

        }


        let cameraId =
            cameras[0].id;


        /* Uu tien camera sau */

        for (let camera of cameras) {

            const ten =
                String(
                    camera.label || ""
                ).toLowerCase();

            if (
                ten.includes("back") ||
                ten.includes("rear") ||
                ten.includes("environment")
            ) {

                cameraId = camera.id;

                break;

            }

        }


        await html5QrCode.start(

            cameraId,

            {

                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }

            },

            xuLyQR,

            function(errorMessage) {

                // Bo qua loi quet lien tuc

            }

        );


        document.getElementById(
            "thongBao"
        ).innerText =
            "Dua QR vao khung de quet";


    } catch(e) {

        console.error(e);

        document.getElementById(
            "thongBao"
        ).innerText =
            "LOI CAMERA: " + e.message;

    }

}


/* =========================
   XU LY KHI QUET DUOC QR
========================= */

async function xuLyQR(maQR) {

    if (daQuet) {

        return;

    }


    daQuet = true;


    maQR =
        String(maQR).trim();


    maQRHienTai =
        maQR;


    /* BIP QUET */

    bipQuetQR();


    document.getElementById(
        "thongBao"
    ).innerText =
        "Da quet QR: " + maQR;


    /* Cho camera on dinh */

    await new Promise(
        resolve =>
            setTimeout(resolve, 300)
    );


    /* =========================
       TU CHUP ANH TU VIDEO
    ========================= */

    try {

        const reader =
            document.getElementById(
                "reader"
            );


        const video =
            reader.querySelector(
                "video"
            );


        if (!video) {

            throw new Error(
                "Khong tim thay video camera"
            );

        }


        const canvas =
            document.createElement(
                "canvas"
            );


        const maxWidth = 1280;


        let width =
            video.videoWidth;

        let height =
            video.videoHeight;


        if (width > maxWidth) {

            height =
                Math.round(
                    height *
                    maxWidth /
                    width
                );

            width =
                maxWidth;

        }


        canvas.width =
            width;

        canvas.height =
            height;


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.drawImage(
            video,
            0,
            0,
            width,
            height
        );


        const anh =
            canvas.toDataURL(
                "image/jpeg",
                0.75
            );


        if (anh) {

            anhBase64 =
                anh;


            /* BIP CHUP */

            bipChupAnh();


            const anhXem =
                document.getElementById(
                    "anhXem"
                );


            anhXem.src =
                anh;


            anhXem.style.display =
                "block";


            document.getElementById(
                "thongBao"
            ).innerText =
                "Da quet va tu chup anh: " +
                maQR;

        }


    } catch(e) {

        console.error(e);

        document.getElementById(
            "thongBao"
        ).innerText =
            "Quet duoc QR nhung khong chup duoc anh";

    }


    /* DUNG CAMERA */

    await dungCamera();

}


/* =========================
   DUNG CAMERA
========================= */

async function dungCamera() {

    try {

        if (html5QrCode) {

            await html5QrCode.stop();

            await html5QrCode.clear();

        }

    } catch(e) {

        console.log(
            "Loi dung camera:",
            e
        );

    }

}


/* =========================
   CHUP LAI
========================= */

async function chupLai() {

    document.getElementById(
        "anhXem"
    ).style.display =
        "none";


    document.getElementById(
        "thongBao"
    ).innerText =
        "Dang mo camera de chup lai...";


    await moCameraChoChupLai();

}


/* =========================
   MO CAMERA DE CHUP LAI
========================= */

async function moCameraChoChupLai() {

    try {

        html5QrCode =
            new Html5Qrcode("reader");


        const cameras =
            await Html5QrCode.getCameras();


        let cameraId =
            cameras[0].id;


        for (let camera of cameras) {

            const ten =
                String(
                    camera.label || ""
                ).toLowerCase();

            if (
                ten.includes("back") ||
                ten.includes("rear") ||
                ten.includes("environment")
            ) {

                cameraId =
                    camera.id;

                break;

            }

        }


        await html5QrCode.start(

            cameraId,

            {

                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }

            },

            async function(maQR) {

                /*
                   Chup lai chi lay anh,
                   khong doi ma QR
                */

                try {

                    const reader =
                        document.getElementById(
                            "reader"
                        );

                    const video =
                        reader.querySelector(
                            "video"
                        );


                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                300
                            )
                    );


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    let width =
                        video.videoWidth;

                    let height =
                        video.videoHeight;


                    const maxWidth =
                        1280;


                    if (
                        width >
                        maxWidth
                    ) {

                        height =
                            Math.round(
                                height *
                                maxWidth /
                                width
                            );

                        width =
                            maxWidth;

                    }


                    canvas.width =
                        width;

                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        video,
                        0,
                        0,
                        width,
                        height
                    );


                    anhBase64 =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.75
                        );


                    document.getElementById(
                        "anhXem"
                    ).src =
                        anhBase64;


                    document.getElementById(
                        "anhXem"
                    ).style.display =
                        "block";


                    bipChupAnh();


                    document.getElementById(
                        "thongBao"
                    ).innerText =
                        "Da chup lai anh";


                    await dungCamera();

                } catch(e) {

                    console.error(e);

                }

            },

            function(errorMessage) {}

        );

    } catch(e) {

        document.getElementById(
            "thongBao"
        ).innerText =
            "LOI CAMERA: " +
            e.message;

    }

}


/* =========================
   QUET QR MOI
========================= */

async function quetMoi() {

    await dungCamera();


    daQuet =
        false;

    maQRHienTai =
        "";

    anhBase64 =
        "";


    document.getElementById(
        "anhXem"
    ).src =
        "";

    document.getElementById(
        "anhXem"
    ).style.display =
        "none";


    document.getElementById(
        "thongBao"
    ).innerText =
        "Dang mo camera...";


    await moCamera();

}


/* =========================
   TU DONG MO CAMERA
========================= */

window.onload =
    function() {

        moCamera();

    };

</script>

</body>
</html>
