const URL_APPS_SCRIPT =

/* =====================================================
   TAO TIENG BIP
   ===================================================== */

function taoTiengBip(
    tanSo,
    thoiGian,
    amLuong
) {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            "square";

        oscillator.frequency.value =
            tanSo;

        gain.gain.value =
            amLuong;

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            thoiGian
        );

    }
    catch(e) {

        console.log(
            "Khong phat duoc tieng bip:",
            e
        );

    }

}


function bipQuetQR() {

    taoTiengBip(
        1000,
        0.35,
        0.8
    );

}


function bipChupAnh() {

    taoTiengBip(
        1500,
        0.20,
        0.8
    );

}


/* =====================================================
   DINH DANG TIEN
   ===================================================== */

function dinhDangTien(so) {

    if (
        so === null ||
        so === undefined ||
        so === ""
    ) {

        return "";

    }

    const n =
        Number(so);

    if (
        isNaN(n)
    ) {

        return so;

    }

    return n.toLocaleString(
        "vi-VN"
    );

}


/* =====================================================
   CAP NHAT NUT NHAN HANG
   ===================================================== */

function capNhatNutNhanHang(data) {

    const khu =
        document.getElementById(
            "khuNhanHang"
        );

    const nut =
        document.getElementById(
            "btnNhanHang"
        );

    if (
        !data ||
        !data.ok
    ) {

        khu.style.display =
            "none";

        nut.disabled =
            true;

        return;

    }

    if (
        data.trangThai ===
        "TON_KHO"
    ) {

        khu.style.display =
            "block";

        nut.disabled =
            false;

    }
    else {

        khu.style.display =
            "none";

        nut.disabled =
            true;

    }

}


/* =====================================================
   HIEN THI DON HANG
   ===================================================== */

function hienThiDonHang(data) {

    document.getElementById(
        "maQR"
    ).innerText =
        data.maQR || "";

    document.getElementById(
        "maDon"
    ).innerText =
        data.maDon || "";

    document.getElementById(
        "khachHang"
    ).innerText =
        data.khachHang || "";

    document.getElementById(
        "soDienThoai"
    ).innerText =

    document.getElementById(
        "diaChi"
    ).innerText =
        data.diaChi || "";

    document.getElementById(
        "tenHang"
    ).innerText =
        data.tenHang || "";

    document.getElementById(
        "soLuong"
    ).innerText =
        data.soLuong ?? "";

    document.getElementById(
        "tienHang"
    ).innerText =
        dinhDangTien(
            data.tienHang
        );

    document.getElementById(
        "tienShip"
    ).innerText =
        dinhDangTien(
            data.tienShip
        );

    document.getElementById(
        "tongTien"
    ).innerText =
        dinhDangTien(
            data.tongTien
        );

    document.getElementById(
        "tonKho"

        data.tonKho ?? "";

    document.getElementById(
        "trangThai"

        data.trangThai || "";

        "thongTinDon"
    ).style.display =
        "block";

    capNhatNutNhanHang(
        data
    );

}


/* =====================================================
   GOI APPS SCRIPT TIM DON
   ===================================================== */

function timDonTrenServer(maQR) {

    return new Promise(function(resolve, reject) {

        document.getElementById("thongBao").innerText =
            "Dang tim don " + maQR + "...";

        const tenCallback =
            "nhanKetQuaQR_" + Date.now();

        let script = null;
        let daXuLy = false;

        const url =
            URL_APPS_SCRIPT +
            "?action=timDon" +
            "&maQR=" +
            encodeURIComponent(maQR) +
            "&callback=" +
            encodeURIComponent(tenCallback);

        console.log("URL JSONP:");
        console.log(url);

        function donDep() {

            delete window[tenCallback];

            if (script && script.parentNode) {
                script.parentNode.removeChild(script);
            }

        }

        window[tenCallback] = function(data) {

            if (daXuLy) {
                return;
            }

            daXuLy = true;

            console.log(
                "Du lieu tu Apps Script:",
                data
            );

            donDep();

            if (data && data.ok) {

               hienThiDonHang(data);
             resolve(data);

            }
            else {

                document.getElementById("thongBao").innerText =
                    (data && data.msg) ||
                    "Khong tim thay don";

                resolve(
                    data || {
                        ok: false,
                        msg: "Khong co du lieu"
                    }
                );

            }

        };

        script =
            document.createElement("script");

        script.src = url;

        script.onload = function() {

            console.log(
                "JSONP script da tai xong"
            );

        };

        script.onerror = function() {

            if (daXuLy) {
                return;
            }

            daXuLy = true;

            donDep();

            console.error(
                "JSONP ERROR:",
                url
            );

            document.getElementById("thongBao").innerText =
                "Loi JSONP Apps Script";

            alert(
                "Apps Script khong tra ve JSONP.\n\n" +
                "Ma QR: " + maQR
            );

            reject(
                new Error(
                    "JSONP Apps Script error"
                )
            );

        };

        document.body.appendChild(script);

    });

}

               const trangThai =
    data && data.trangThai
        ? String(data.trangThai).trim().toUpperCase()
        : "";

console.log("Du lieu tra ve:", data);
console.log("Trang thai:", trangThai);

if (
    data &&
    data.ok === true &&
    trangThai === "DANG_GIAO"
) {
    document.getElementById("thongBao").innerText =
        "DA NHAN HANG THANH CONG";

    capNhatNutNhanHang(data);

    return;
}

                    document.getElementById("thongBao").innerText =
                        "DA NHAN HANG THANH CONG";

                    capNhatNutNhanHang(data);

                    return;
                }

                if (lanThu < soLanToiDa) {

                    lanThu++;

                    setTimeout(function() {
                        kiemTraKetQua();
                    }, thoiGianCho);

                } else {

                    ddocument.getElementById("thongBao").innerText =
    "Nhan hang chua thanh cong. Trang thai hien tai: " +
    (data && data.trangThai
        ? data.trangThai
        : "KHONG CO DU LIEU") +
    ". Loi: " +

        ? data.msg

                }

            })

            .catch(function(err) {

                console.log(err);

                if (lanThu < soLanToiDa) {

                    lanThu++;

                    setTimeout(function() {

/* =====================================================
   MO CAMERA
   ===================================================== */

async function moCamera() {

    try {

        document.getElementById(
            "thongBao"
        ).innerText =
            "Dang mo camera...";


        html5QrCode =
            new Html5Qrcode(
                "reader"
            );


        const cameras =
            await Html5Qrcode.getCameras();


        if (
            !cameras ||
            cameras.length === 0
        ) {

            throw new Error(
                "Khong tim thay camera"
            );

        }


        let cameraId =
            cameras[0].id;


        for (
            let camera of cameras
        ) {

            const ten =
                String(
                    camera.label || ""
                ).toLowerCase();


            if (
                ten.includes("back") ||
                ten.includes("rear") ||
                ten.includes("environment")
            ) {

                cameraId =
                    camera.id;

                break;

            }

        }


        await html5QrCode.start(

            cameraId,

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }
            },

            xuLyQR,

            function(errorMessage) {
                // Bo qua loi quet lien tuc
            }

        );


        document.getElementById(
            "thongBao"
        ).innerText =
            "Dua QR vao khung de quet";

    }
    catch(e) {

        console.error(e);


        document.getElementById(
            "thongBao"
        ).innerText =
            "LOI CAMERA: " +
            e.message;

    }

}


/* =====================================================
   XU LY QR
   ===================================================== */

async function xuLyQR(
    maQR
) {

    if (
        daQuet
    ) {

        return;

    }


    daQuet =
        true;


    maQR =
        String(
            maQR
        ).trim();


    maQRHienTai =
        maQR;


    bipQuetQR();


    document.getElementById(
        "thongBao"
    ).innerText =
        "Da quet QR: " +
        maQR;


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                300
            )
    );


    /* =================================================
       TU CHUP ANH
       ================================================= */

    try {

        const reader =
            document.getElementById(
                "reader"
            );


        const video =
            reader.querySelector(
                "video"
            );


        if (!video) {

            throw new Error(
                "Khong tim thay video camera"
            );

        }


        const canvas =
            document.createElement(
                "canvas"
            );


        const maxWidth =
            1280;


        let width =
            video.videoWidth;


        let height =
            video.videoHeight;


        if (
            width > maxWidth
        ) {

            height =
                Math.round(
                    height *
                    maxWidth /
                    width
                );

            width =
                maxWidth;

        }


        canvas.width =
            width;


        canvas.height =
            height;


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.drawImage(
            video,
            0,
            0,
            width,
            height
        );


        const anh =
            canvas.toDataURL(
                "image/jpeg",
                0.75
            );


        if (
            anh
        ) {

            anhBase64 =
                anh;


            bipChupAnh();


            const anhXem =
                document.getElementById(
                    "anhXem"
                );


            anhXem.src =
                anh;


            anhXem.style.display =
                "block";


            document.getElementById(
                "thongBao"
            ).innerText =
                "Da quet va tu chup anh: " +
                maQR;

        }

    }
    catch(e) {

        console.error(e);


        document.getElementById(
            "thongBao"
        ).innerText =
            "Quet duoc QR nhung khong chup duoc anh";

    }


    await dungCamera();


    /* =================================================
       GOI APPS SCRIPT
       ================================================= */

    await timDonTrenServer(
        maQR
    );

}


/* =====================================================
   DUNG CAMERA
   ===================================================== */

async function dungCamera() {

    try {

        if (
            html5QrCode
        ) {

            await html5QrCode.stop();

            await html5QrCode.clear();

        }

    }
    catch(e) {

        console.log(
            "Loi dung camera:",
            e
        );

    }

}

/* =====================================================
   MO CAMERA CHUP LAI
   ===================================================== */

async function moCameraChoChupLai() {

    try {

        html5QrCode =
            new Html5Qrcode(
                "reader"
            );


        const cameras =
            await Html5Qrcode.getCameras();


        let cameraId =
            cameras[0].id;


        for (
            let camera of cameras
        ) {

            const ten =
                String(
                    camera.label || ""
                ).toLowerCase();


            if (
                ten.includes("back") ||
                ten.includes("rear") ||
                ten.includes("environment")
            ) {

                cameraId =
                    camera.id;

                break;

            }

        }


        await html5QrCode.start(

            cameraId,

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }
            },

            async function(
                maQR
            ) {

                try {

                    const reader =
                        document.getElementById(
                            "reader"
                        );


                    const video =
                        reader.querySelector(
                            "video"
                        );


                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                300
                            )
                    );


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    let width =
                        video.videoWidth;


                    let height =
                        video.videoHeight;


                    const maxWidth =
                        1280;


                    if (
                        width > maxWidth
                    ) {

                        height =
                            Math.round(
                                height *
                                maxWidth /
                                width
                            );

                        width =
                            maxWidth;

                    }


                    canvas.width =
                        width;


                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        video,
                        0,
                        0,
                        width,
                        height
                    );


                    anhBase64 =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.75
                        );


                    document.getElementById(
                        "anhXem"
                    ).src =
                        anhBase64;


                    document.getElementById(
                        "anhXem"
                    ).style.display =
                        "block";


                    bipChupAnh();


                    document.getElementById(
                        "thongBao"
                    ).innerText =
                        "Da chup lai anh";


                    await dungCamera();

                }
                catch(e) {

                    console.error(e);

                }

            },

            function(
                errorMessage
            ) {}

        );

    }
    catch(e) {

        document.getElementById(
            "thongBao"
        ).innerText =
            "LOI CAMERA: " +
            e.message;

    }

}

   DANG NHAP
   ===================================================== */

let maNVDaDangNhap = "";

function dangNhapTuApp() {

    const maNV = document.getElementById("maNVDangNhap").value.trim();
    const matKhau = document.getElementById("matKhauDangNhap").value;

    const baoLoi = document.getElementById("baoLoiDangNhap");
    const nut = document.getElementById("btnDangNhap");

    if (!maNV || !matKhau) {
        baoLoi.innerText = "Hay nhap ma nhan vien va mat khau";
        return;
    }

    nut.disabled = true;
    baoLoi.style.color = "#333";
    baoLoi.innerText = "Dang kiem tra dang nhap...";

    const tenCallback = "nhanKetQuaDangNhap_" + Date.now();
    let script = null;
    let daXuLy = false;

    const url =
        URL_APPS_SCRIPT +
        "?action=dangNhap" +
        "&maNV=" + encodeURIComponent(maNV) +
        "&matKhau=" + encodeURIComponent(matKhau) +
        "&callback=" + encodeURIComponent(tenCallback);

    function donDep() {
        delete window[tenCallback];

        if (script && script.parentNode) {
            script.parentNode.removeChild(script);
        }
    }

    window[tenCallback] = function(data) {

        if (daXuLy) {
            return;
        }

        daXuLy = true;
        donDep();

        if (data && data.ok) {

            maNVDaDangNhap = data.maNV || maNV;

            document.getElementById("maNVNhap").value = maNVDaDangNhap;
            document.getElementById("maNVNhap").readOnly = true;

            document.getElementById("khuDangNhap").style.display = "none";
            document.getElementById("khuUngDung").style.display = "block";

            document.getElementById("thongBao").innerText =
                "Xin chao " + (data.tenNV || maNVDaDangNhap) + ". Dang mo camera...";

            moCamera();

        } else {

            baoLoi.style.color = "#b00020";
            baoLoi.innerText =
                (data && data.msg) || "Dang nhap khong thanh cong";

            nut.disabled = false;
        }
    };

    script = document.createElement("script");
    script.src = url;

    script.onerror = function() {

        if (daXuLy) {
            return;
        }

        daXuLy = true;
        donDep();

        baoLoi.style.color = "#b00020";
        baoLoi.innerText = "Khong ket noi duoc Apps Script";
        nut.disabled = false;
    };

    document.body.appendChild(script);
}

document.addEventListener("keydown", function(e) {
    if (e.key === "Enter" &&
        document.getElementById("khuDangNhap").style.display !== "none") {
        dangNhapTuApp();
    }
});


/* =====================================================
   TU DONG MO CAMERA
   ===================================================== */

window.onload =
    function() {

        document.getElementById("maNVDangNhap").focus();

    };

</script>
