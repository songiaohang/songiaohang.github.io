<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Giao Nhan Hang - V5.2</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    padding:15px;
    background:#f2f2f2;
}

h2{
    text-align:center;
    margin-top:5px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    font-size:18px;
    border:0;
    border-radius:8px;
    background:#1976d2;
    color:white;
}

button:active{
    opacity:0.7;
}

#reader{
    width:100%;
    max-width:500px;
    margin:15px auto;
    background:#000;
    border-radius:8px;
    overflow:hidden;
}

#trangThai{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin:15px 0;
}

#maQR{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    word-break:break-all;
}

#anhChup{
    width:100%;
    max-width:500px;
    display:none;
    margin:15px auto;
    border-radius:8px;
}
</style>
</head>

<body>

<h2>GIAO NHAN HANG</h2>

<div id="trangThai">
    San sang mo camera
</div>

<div id="maQR"></div>

<div id="reader"></div>

<img id="anhChup">

<button onclick="moCamera()">
    MO CAMERA
</button>

<button onclick="chupLai()">
    CHUP LAI
</button>

<button onclick="quetMoi()">
    QUET QR MOI
</button>


<script>

/* =====================================================
   TIENG BIP
   ===================================================== */

let audioContext = null;

function taoTiengBip(tanSo, thoiGian, amLuong) {

    try {

        if (!audioContext) {

            audioContext =
                new (window.AudioContext ||
                     window.webkitAudioContext)();

        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = "square";

        oscillator.frequency.value = tanSo;

        gain.gain.value = amLuong;

        oscillator.connect(gain);

        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + thoiGian
        );

    } catch(e) {

        console.log(
            "Khong phat duoc tieng bip:",
            e
        );

    }

}


/* =====================================================
   BIP QUET QR
   ===================================================== */

function bipQuetQR() {

    taoTiengBip(
        1000,
        0.35,
        0.8
    );

}


/* =====================================================
   BIP CHUP ANH
   ===================================================== */

function bipChupAnh() {

    taoTiengBip(
        1500,
        0.20,
        0.8
    );

}


/* =====================================================
   BIEN CAMERA
   ===================================================== */

let html5QrCode = null;

let dangChay = false;

let daQuet = false;

let anhBase64 = "";

let maQRHienTai = "";


/* =====================================================
   MO CAMERA
   ===================================================== */

function moCamera() {

    if (dangChay) {
        return;
    }

    daQuet = false;

    document.getElementById("trangThai").innerHTML =
        "Dang tim camera...";


    Html5Qrcode.getCameras()

    .then(function(cameras) {

        if (!cameras ||
            cameras.length === 0) {

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Khong tim thay camera";

            return;
        }


        /*
         * Mac dinh lay camera dau tien
         */

        let cameraId =
            cameras[0].id;


        /*
         * Uu tien camera sau
         */

        for (
            let i = 0;
            i < cameras.length;
            i++
        ) {

            let ten =
                (cameras[i].label || "")
                .toLowerCase();


            if (
                ten.includes("back") ||
                ten.includes("rear") ||
                ten.includes("environment") ||
                ten.includes("sau")
            ) {

                cameraId =
                    cameras[i].id;

                break;
            }

        }


        /*
         * Tao doi tuong QR
         */

        html5QrCode =
            new Html5Qrcode("reader");


        const cauHinh = {

            fps:10,

            qrbox:{
                width:250,
                height:250
            }

        };


        /*
         * BAT DAU CAMERA
         */

        html5QrCode.start(

            cameraId,

            cauHinh,

            function(maQR) {

                xuLyQR(maQR);

            },

            function(loi) {

                /*
                 * Khong hien loi scan
                 */

            }

        )

        .then(function() {

            dangChay = true;

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Camera dang hoat dong - Dua QR vao khung";

        })

        .catch(function(error) {

            console.log(
                "LOI CAMERA:",
                error
            );

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Khong mo duoc camera: " +
                error;

        });


    })

    .catch(function(error) {

        console.log(
            "LOI GET CAMERA:",
            error
        );

        document.getElementById(
            "trangThai"
        ).innerHTML =
            "Khong lay duoc danh sach camera: " +
            error;

    });

}


/* =====================================================
   XU LY QR
   ===================================================== */

function xuLyQR(maQR) {

    if (daQuet) {
        return;
    }

    daQuet = true;


    maQR =
        String(maQR).trim();


    maQRHienTai =
        maQR;


    /*
     * BIP QUET QR
     */

    bipQuetQR();


    document.getElementById(
        "maQR"
    ).innerHTML =
        "Ma QR: " + maQR;


    document.getElementById(
        "trangThai"
    ).innerHTML =
        "Da quet QR - Dang chup anh...";


    /*
     * Cho camera on dinh
     */

    setTimeout(function() {

        chupAnhTuCamera(

            function(anh) {

                if (anh) {

                    anhBase64 =
                        anh;


                    /*
                     * BIP CHUP ANH
                     */

                    bipChupAnh();


                    document.getElementById(
                        "anhChup"
                    ).src =
                        anh;


                    document.getElementById(
                        "anhChup"
                    ).style.display =
                        "block";


                    document.getElementById(
                        "trangThai"
                    ).innerHTML =
                        "Da quet QR va chup anh thanh cong";


                } else {

                    document.getElementById(
                        "trangThai"
                    ).innerHTML =
                        "Khong chup duoc anh";

                }


                /*
                 * Dung camera sau khi chup
                 */

                dungCamera();

            }

        );

    },300);

}


/* =====================================================
   CHUP ANH TU CAMERA
   ===================================================== */

function chupAnhTuCamera(callback) {

    const reader =
        document.getElementById(
            "reader"
        );


    const video =
        reader.querySelector(
            "video"
        );


    if (!video) {

        callback("");

        return;
    }


    if (
        video.readyState <
        HTMLMediaElement.HAVE_CURRENT_DATA
    ) {

        setTimeout(
            function() {

                chupAnhTuCamera(
                    callback
                );

            },
            300
        );

        return;
    }


    const canvas =
        document.createElement(
            "canvas"
        );


    let width =
        video.videoWidth;


    let height =
        video.videoHeight;


    if (
        !width ||
        !height
    ) {

        callback("");

        return;
    }


    /*
     * Gioi han anh 1280px
     */

    const maxWidth =
        1280;


    if (width > maxWidth) {

        const tyLe =
            maxWidth / width;

        width =
            maxWidth;

        height =
            Math.round(
                height * tyLe
            );

    }


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );


    /*
     * Tao JPEG
     */

    anhBase64 =
        canvas.toDataURL(
            "image/jpeg",
            0.75
        );


    callback(
        anhBase64
    );

}


/* =====================================================
   DUNG CAMERA
   ===================================================== */

function dungCamera() {

    if (
        html5QrCode &&
        dangChay
    ) {

        html5QrCode.stop()

        .then(function() {

            html5QrCode.clear();

            html5QrCode =
                null;

            dangChay =
                false;

        })

        .catch(function(error) {

            console.log(
                "Loi dung camera:",
                error
            );

            html5QrCode =
                null;

            dangChay =
                false;

        });

    }

}


/* =====================================================
   CHUP LAI
   ===================================================== */

function chupLai() {

    if (dangChay) {
        return;
    }


    if (!maQRHienTai) {

        document.getElementById(
            "trangThai"
        ).innerHTML =
            "Chua co ma QR";

        return;
    }


    document.getElementById(
        "trangThai"
    ).innerHTML =
        "Dang mo camera de chup lai...";


    moCameraChoChupLai();

}


/* =====================================================
   MO CAMERA CHO CHUP LAI
   ===================================================== */

function moCameraChoChupLai() {

    if (dangChay) {
        return;
    }


    Html5Qrcode.getCameras()

    .then(function(cameras) {

        if (
            !cameras ||
            cameras.length === 0
        ) {

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Khong tim thay camera";

            return;
        }


        let cameraId =
            cameras[0].id;


        for (
            let i = 0;
            i < cameras.length;
            i++
        ) {

            let ten =
                (cameras[i].label || "")
                .toLowerCase();


            if (
                ten.includes("back") ||
                ten.includes("rear") ||
                ten.includes("environment") ||
                ten.includes("sau")
            ) {

                cameraId =
                    cameras[i].id;

                break;
            }

        }


        html5QrCode =
            new Html5Qrcode(
                "reader"
            );


        const cauHinh = {

            fps:10,

            qrbox:{
                width:250,
                height:250
            }

        };


        html5QrCode.start(

            cameraId,

            cauHinh,

            function(maQR) {

                /*
                 * Khi chup lai,
                 * khong doi QR moi
                 */

            },

            function(loi) {}

        )

        .then(function() {

            dangChay =
                true;


            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Camera dang mo - Bam chup lai sau khi canh anh";


            /*
             * Tu chup sau 1 giay
             */

            setTimeout(
                function() {

                    chupAnhTuCamera(

                        function(anh) {

                            if (anh) {

                                anhBase64 =
                                    anh;

                                bipChupAnh();


                                document.getElementById(
                                    "anhChup"
                                ).src =
                                    anh;


                                document.getElementById(
                                    "anhChup"
                                ).style.display =
                                    "block";


                                document.getElementById(
                                    "trangThai"
                                ).innerHTML =
                                    "Da chup lai anh";

                            }


                            dungCamera();

                        }

                    );

                },
                1000
            );

        })

        .catch(function(error) {

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Khong mo duoc camera: " +
                error;

        });

    })

    .catch(function(error) {

        document.getElementById(
            "trangThai"
        ).innerHTML =
            "Khong lay duoc camera: " +
            error;

    });

}


/* =====================================================
   QUET QR MOI
   ===================================================== */

function quetMoi() {

    dungCamera();


    maQRHienTai =
        "";

    anhBase64 =
        "";

    daQuet =
        false;


    document.getElementById(
        "maQR"
    ).innerHTML =
        "";


    document.getElementById(
        "anhChup"
    ).style.display =
        "none";


    document.getElementById(
        "anhChup"
    ).src =
        "";


    document.getElementById(
        "trangThai"
    ).innerHTML =
        "San sang quet QR moi";


    setTimeout(
        function() {

            moCamera();

        },
        300
    );

}

</script>

</body>
</html>
