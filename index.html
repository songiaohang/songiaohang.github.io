<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SO GIAO HANG</title>

    <!-- Thu vien quet QR -->
    <script src="https://unpkg.com/html5-qrcode"
            type="text/javascript"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
        }

        h2 {
            margin: 5px 0 15px 0;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        #ketQua {
            margin: 15px auto;
            padding: 12px;
            max-width: 500px;
            background: white;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            word-break: break-word;
        }

        #anhPreview {
            width: 100%;
            max-width: 500px;
            margin: 10px auto;
            display: none;
            border-radius: 10px;
        }

        .nut {
            width: 100%;
            max-width: 500px;
            margin: 8px auto;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #btnChupLai {
            background: #ff9800;
            color: white;
            display: none;
        }

        #btnQuetMoi {
            background: #2196f3;
            color: white;
        }

        #btnBatCamera {
            background: #4caf50;
            color: white;
        }

        #trangThai {
            margin: 10px auto;
            max-width: 500px;
            font-size: 15px;
            color: #555;
        }
    </style>
</head>

<body>

    <h2>SO GIAO HANG</h2>

    <div id="trangThai">
        Dang khoi dong camera...
    </div>

    <!-- Khu vuc camera -->
    <div id="reader"></div>

    <!-- Ket qua QR -->
    <div id="ketQua">
        Chua quet QR
    </div>

    <!-- Anh vua chup -->
    <img id="anhPreview" alt="Anh vua chup">

    <!-- Nut chup lai -->
    <button id="btnChupLai"
            class="nut"
            onclick="chupLaiAnh()">
        CHUP LAI ANH
    </button>

    <!-- Nut quet QR moi -->
    <button id="btnQuetMoi"
            class="nut"
            onclick="quetQRMoi()">
        QUET QR MOI
    </button>

    <script>

        // ==========================================
        // BIEN TOAN CUC
        // ==========================================

        let html5QrCode = null;

        let maQRHienTai = "";

        let anhBase64 = "";

        let dangXuLy = false;

        let audioContext = null;


        // ==========================================
        // TAO TIENG BIP
        // ==========================================

        function taoTiengBip(tanSo, thoiGian, amLuong) {

            try {

                if (!audioContext) {

                    audioContext =
                        new (window.AudioContext ||
                             window.webkitAudioContext)();
                }

                if (audioContext.state === "suspended") {

                    audioContext.resume();
                }

                const oscillator =
                    audioContext.createOscillator();

                const gain =
                    audioContext.createGain();

                oscillator.type = "square";

                oscillator.frequency.value = tanSo;

                gain.gain.value = amLuong;

                oscillator.connect(gain);

                gain.connect(audioContext.destination);

                oscillator.start();

                oscillator.stop(
                    audioContext.currentTime + thoiGian
                );

            } catch (e) {

                console.log(
                    "Khong phat duoc tieng bip:",
                    e
                );
            }
        }


        // ==========================================
        // BIP KHI QUET QR
        // ==========================================

        function bipQuetQR() {

            taoTiengBip(
                1000,
                0.35,
                0.8
            );

            rungDienThoai(500);
        }


        // ==========================================
        // BIP KHI CHUP ANH
        // ==========================================

        function bipChupAnh() {

            taoTiengBip(
                1500,
                0.20,
                0.8
            );

            rungDienThoai(200);
        }


        // ==========================================
        // RUNG DIEN THOAI
        // ==========================================

        function rungDienThoai(thoiGian) {

            try {

                if (navigator.vibrate) {

                    navigator.vibrate(thoiGian);

                } else {

                    console.log(
                        "Thiet bi khong ho tro rung."
                    );
                }

            } catch (e) {

                console.log(
                    "Khong rung duoc:",
                    e
                );
            }
        }


        // ==========================================
        // KHOI DONG CAMERA
        // ==========================================

        async function khoiDongCamera() {

            try {

                document.getElementById(
                    "trangThai"
                ).innerText =
                    "Dang tim camera sau...";

                html5QrCode =
                    new Html5Qrcode("reader");


                // Lay danh sach camera
                const cameras =
                    await Html5Qrcode.getCameras();


                if (!cameras ||
                    cameras.length === 0) {

                    throw new Error(
                        "Khong tim thay camera."
                    );
                }


                // Tim camera sau
                let cameraSau =
                    cameras.find(
                        camera =>
                            /back|rear|environment/i
                            .test(camera.label)
                    );


                // Neu khong tim thay
                // thi lay camera cuoi
                if (!cameraSau) {

                    cameraSau =
                        cameras[cameras.length - 1];
                }


                document.getElementById(
                    "trangThai"
                ).innerText =
                    "Camera da san sang - Dua QR vao khung";


                await html5QrCode.start(

                    cameraSau.id,

                    {
                        fps: 10,

                        qrbox: function(
                            viewfinderWidth,
                            viewfinderHeight
                        ) {

                            let kichThuoc =
                                Math.min(
                                    viewfinderWidth,
                                    viewfinderHeight
                                ) * 0.70;

                            return {
                                width: kichThuoc,
                                height: kichThuoc
                            };
                        },

                        aspectRatio: 1.0
                    },

                    khiQuetThanhCong,

                    khiQuetLoi

                );

            } catch (error) {

                console.error(error);

                document.getElementById(
                    "trangThai"
                ).innerText =
                    "LOI CAMERA: " +
                    error.message;
            }
        }


        // ==========================================
        // KHI QUET QR THANH CONG
        // ==========================================

        async function khiQuetThanhCong(
            maQR,
            ketQua
        ) {

            // Khong cho quet lap
            if (dangXuLy) {
                return;
            }

            dangXuLy = true;


            // Chuan hoa ma QR
            maQR =
                String(maQR).trim();


            maQRHienTai =
                maQR;


            // BIP + RUNG
            bipQuetQR();


            // Hien thi QR
            document.getElementById(
                "ketQua"
            ).innerText =
                "MA QR: " + maQR;


            document.getElementById(
                "trangThai"
            ).innerText =
                "Da quet QR - Dang tu dong chup anh...";


            // Dung camera
            try {

                await html5QrCode.stop();

            } catch (e) {

                console.log(
                    "Khong dung duoc camera:",
                    e
                );
            }


            // Cho camera dung hinh
            setTimeout(
                function() {

                    chupAnhTuCamera();

                },
                500
            );
        }


        // ==========================================
        // LOI KHI DANG QUET
        // ==========================================

        function khiQuetLoi(errorMessage) {

            // Khong hien loi lien tuc
            // vi ham nay chay rat nhieu lan
        }


        // ==========================================
        // CHUP ANH TU CAMERA
        // ==========================================

        function chupAnhTuCamera() {

            try {

                const reader =
                    document.getElementById(
                        "reader"
                    );


                const video =
                    reader.querySelector(
                        "video"
                    );


                if (!video) {

                    throw new Error(
                        "Khong tim thay video camera."
                    );
                }


                // Tao canvas
                const canvas =
                    document.createElement(
                        "canvas"
                    );


                // Gioi han anh toi da
                let chieuRong =
                    video.videoWidth;

                let chieuCao =
                    video.videoHeight;


                const maxWidth = 1000;


                if (chieuRong > maxWidth) {

                    const tyLe =
                        maxWidth /
                        chieuRong;

                    chieuRong =
                        maxWidth;

                    chieuCao =
                        chieuCao * tyLe;
                }


                canvas.width =
                    chieuRong;

                canvas.height =
                    chieuCao;


                const ctx =
                    canvas.getContext(
                        "2d"
                    );


                // Chup khung hinh
                ctx.drawImage(
                    video,
                    0,
                    0,
                    chieuRong,
                    chieuCao
                );


                // Chuyen thanh JPG
                const anh =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.70
                    );


                if (!anh) {

                    throw new Error(
                        "Khong tao duoc anh."
                    );
                }


                // Luu anh
                anhBase64 =
                    anh;


                // BIP + RUNG
                bipChupAnh();


                // Hien thi anh
                const img =
                    document.getElementById(
                        "anhPreview"
                    );

                img.src =
                    anhBase64;

                img.style.display =
                    "block";


                // Hien thi nut chup lai
                document.getElementById(
                    "btnChupLai"
                ).style.display =
                    "block";


                document.getElementById(
                    "trangThai"
                ).innerText =
                    "Da chup anh thanh cong.";


            } catch (error) {

                console.error(error);

                document.getElementById(
                    "trangThai"
                ).innerText =
                    "LOI CHUP ANH: " +
                    error.message;

                // Cho phep thu lai
                dangXuLy = false;
            }
        }


        // ==========================================
        // CHUP LAI ANH
        // ==========================================

        async function chupLaiAnh() {

            document.getElementById(
                "trangThai"
            ).innerText =
                "Dang mo lai camera de chup...";


            dangXuLy = false;


            try {

                await html5QrCode.start(

                    {
                        facingMode:
                            "environment"
                    },

                    {
                        fps: 10,

                        qrbox: function(
                            viewfinderWidth,
                            viewfinderHeight
                        ) {

                            let kichThuoc =
                                Math.min(
                                    viewfinderWidth,
                                    viewfinderHeight
                                ) * 0.70;

                            return {
                                width: kichThuoc,
                                height: kichThuoc
                            };
                        },

                        aspectRatio: 1.0
                    },

                    khiQuetThanhCong,

                    khiQuetLoi

                );

            } catch (error) {

                console.error(error);

                document.getElementById(
                    "trangThai"
                ).innerText =
                    "LOI MO CAMERA: " +
                    error.message;
            }
        }


        // ==========================================
        // QUET QR MOI
        // ==========================================

        async function quetQRMoi() {

            maQRHienTai = "";

            anhBase64 = "";

            dangXuLy = false;


            // Xoa anh
            const img =
                document.getElementById(
                    "anhPreview"
                );

            img.src = "";

            img.style.display =
                "none";


            // An nut chup lai
            document.getElementById(
                "btnChupLai"
            ).style.display =
                "none";


            // Xoa ket qua
            document.getElementById(
                "ketQua"
            ).innerText =
                "Chua quet QR";


            document.getElementById(
                "trangThai"
            ).innerText =
                "Dang mo camera...";


            try {

                // Tao lai doi tuong
                // neu can
                if (!html5QrCode) {

                    html5QrCode =
                        new Html5Qrcode(
                            "reader"
                        );
                }


                await html5QrCode.start(

                    {
                        facingMode:
                            "environment"
                    },

                    {
                        fps: 10,

                        qrbox: function(
                            viewfinderWidth,
                            viewfinderHeight
                        ) {

                            let kichThuoc =
                                Math.min(
                                    viewfinderWidth,
                                    viewfinderHeight
                                ) * 0.70;

                            return {
                                width: kichThuoc,
                                height: kichThuoc
                            };
                        },

                        aspectRatio: 1.0
                    },

                    khiQuetThanhCong,

                    khiQuetLoi

                );


                document.getElementById(
                    "trangThai"
                ).innerText =
                    "Camera da san sang - Dua QR vao khung";


            } catch (error) {

                console.error(error);

                document.getElementById(
                    "trangThai"
                ).innerText =
                    "LOI MO CAMERA: " +
                    error.message;
            }
        }


        // ==========================================
        // KHOI DONG KHI MO TRANG
        // ==========================================

        window.addEventListener(
            "load",
            function() {

                khoiDongCamera();

            }
        );

    </script>

</body>
</html>
