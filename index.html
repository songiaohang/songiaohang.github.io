<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Giao Nhan QR</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 15px;
    text-align: center;
    background: #f2f2f2;
}

h2 {
    margin-top: 5px;
}

#reader {
    width: 100%;
    max-width: 500px;
    margin: auto;
    background: white;
}

#anhXem {
    width: 100%;
    max-width: 500px;
    margin-top: 15px;
    display: none;
}

#thongBao {
    margin: 10px;
    font-size: 18px;
    font-weight: bold;
}

#thongTinDon {
    display: none;
    width: 95%;
    max-width: 500px;
    margin: 15px auto;
    padding: 15px;
    background: white;
    border-radius: 10px;
    text-align: left;
    box-sizing: border-box;
}

.dong {
    padding: 7px 0;
    border-bottom: 1px solid #ddd;
}

.tenCot {
    font-weight: bold;
}

button {
    width: 90%;
    max-width: 400px;
    padding: 14px;
    margin: 8px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    background: #333;
    color: white;
}

#maNVNhap {
    width: 90%;
    max-width: 400px;
    padding: 14px;
    font-size: 18px;
    box-sizing: border-box;
    margin: 8px;
}

</style>

</head>

<body>

<h2>GIAO NHAN QR</h2>

<div id="thongBao">
    Dang khoi dong camera...
</div>

<div id="reader"></div>

<img id="anhXem">

<!-- =====================================================
     THONG TIN DON HANG
     ===================================================== -->

<div id="thongTinDon">

    <div class="dong">
        <span class="tenCot">Ma QR:</span>
        <span id="maQR"></span>
    </div>

    <div class="dong">
        <span class="tenCot">Ma don:</span>
        <span id="maDon"></span>
    </div>

    <div class="dong">
        <span class="tenCot">Khach hang:</span>
        <span id="khachHang"></span>
    </div>

    <div class="dong">
        <span class="tenCot">So dien thoai:</span>
        <span id="soDienThoai"></span>
    </div>

    <div class="dong">
        <span class="tenCot">Dia chi:</span>
        <span id="diaChi"></span>
    </div>

    <div class="dong">
        <span class="tenCot">Ten hang:</span>
        <span id="tenHang"></span>
    </div>

    <div class="dong">
        <span class="tenCot">So luong:</span>
        <span id="soLuong"></span>
    </div>

    <div class="dong">
        <span class="tenCot">Tien hang:</span>
        <span id="tienHang"></span>
    </div>

    <div class="dong">
        <span class="tenCot">Tien ship:</span>
        <span id="tienShip"></span>
    </div>

    <div class="dong">
        <span class="tenCot">Tong tien:</span>
        <span id="tongTien"></span>
    </div>

    <div class="dong">
        <span class="tenCot">Ton kho:</span>
        <span id="tonKho"></span>
    </div>

    <div class="dong">
        <span class="tenCot">Trang thai:</span>
        <span id="trangThai"></span>
    </div>

</div>


<!-- =====================================================
     KHU VUC NHAN HANG
     ===================================================== -->

<div
    id="khuNhanHang"
    style="
        display:none;
        margin:15px auto;
        width:95%;
        max-width:500px;
    "
>

    <input
        id="maNVNhap"
        type="text"
        value="NV01"
        placeholder="Nhap ma nhan vien"
    >

    <button
        id="btnNhanHang"
        onclick="nhanHangTuApp()"
        disabled
    >
        NHAN HANG
    </button>

</div>


<!-- =====================================================
     KHUNG GUI FORM
     ===================================================== -->

<iframe
    name="khungGui"
    id="khungGui"
    style="display:none;"
></iframe>


<form
    id="formNhanHang"
    method="POST"
    action="https://script.google.com/macros/s/AKfycbxX8tCmxmDWaE0iqqzySEfgvIYaFhiL64cDAwtII9iwze_tPTGa8qyWcjSNZzvjLAVGw/exec"
    target="khungGui"
    style="display:none;"
>

    <input
        type="hidden"
        name="hanhDong"
        id="guiHanhDong"
    >

    <input
        type="hidden"
        name="maQR"
        id="guiMaQR"
    >

    <input
        type="hidden"
        name="maNV"
        id="guiMaNV"
    >

    <input
        type="hidden"
        name="anhBase64"
        id="guiAnhBase64"
    >

</form>


<button onclick="chupLai()">
    CHUP LAI
</button>

<button onclick="quetMoi()">
    QUET QR MOI
</button>


<script>

/* =====================================================
   BIEN CAMERA
   ===================================================== */

let html5QrCode = null;

let daQuet = false;

let maQRHienTai = "";

let anhBase64 = "";

let audioContext = null;


/* =====================================================
   URL APPS SCRIPT
   ===================================================== */

const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbxX8tCmxmDWaE0iqqzySEfgvIYaFhiL64cDAwtII9iwze_tPTGa8qyWcjSNZzvjLAVGw/exec";


/* =====================================================
   TAO TIENG BIP
   ===================================================== */

function taoTiengBip(
    tanSo,
    thoiGian,
    amLuong
) {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            "square";

        oscillator.frequency.value =
            tanSo;

        gain.gain.value =
            amLuong;

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            thoiGian
        );

    }
    catch(e) {

        console.log(
            "Khong phat duoc tieng bip:",
            e
        );

    }

}


function bipQuetQR() {

    taoTiengBip(
        1000,
        0.35,
        0.8
    );

}


function bipChupAnh() {

    taoTiengBip(
        1500,
        0.20,
        0.8
    );

}


/* =====================================================
   DINH DANG TIEN
   ===================================================== */

function dinhDangTien(so) {

    if (
        so === null ||
        so === undefined ||
        so === ""
    ) {

        return "";

    }

    const n =
        Number(so);

    if (
        isNaN(n)
    ) {

        return so;

    }

    return n.toLocaleString(
        "vi-VN"
    );

}


/* =====================================================
   CAP NHAT NUT NHAN HANG
   ===================================================== */

function capNhatNutNhanHang(data) {

    const khu =
        document.getElementById(
            "khuNhanHang"
        );

    const nut =
        document.getElementById(
            "btnNhanHang"
        );

    if (
        !data ||
        !data.ok
    ) {

        khu.style.display =
            "none";

        nut.disabled =
            true;

        return;

    }

    if (
        data.trangThai ===
        "TON_KHO"
    ) {

        khu.style.display =
            "block";

        nut.disabled =
            false;

    }
    else {

        khu.style.display =
            "none";

        nut.disabled =
            true;

    }

}


/* =====================================================
   HIEN THI DON HANG
   ===================================================== */

function hienThiDonHang(data) {

    document.getElementById(
        "maQR"
    ).innerText =
        data.maQR || "";

    document.getElementById(
        "maDon"
    ).innerText =
        data.maDon || "";

    document.getElementById(
        "khachHang"
    ).innerText =
        data.khachHang || "";

    document.getElementById(
        "soDienThoai"
    ).innerText =
        data.soDienThoai || "";

    document.getElementById(
        "diaChi"
    ).innerText =
        data.diaChi || "";

    document.getElementById(
        "tenHang"
    ).innerText =
        data.tenHang || "";

    document.getElementById(
        "soLuong"
    ).innerText =
        data.soLuong ?? "";

    document.getElementById(
        "tienHang"
    ).innerText =
        dinhDangTien(
            data.tienHang
        );

    document.getElementById(
        "tienShip"
    ).innerText =
        dinhDangTien(
            data.tienShip
        );

    document.getElementById(
        "tongTien"
    ).innerText =
        dinhDangTien(
            data.tongTien
        );

    document.getElementById(
        "tonKho"
    ).innerText =
        data.tonKho ?? "";

    document.getElementById(
        "trangThai"
    ).innerText =
        data.trangThai || "";

    document.getElementById(
        "thongTinDon"
    ).style.display =
        "block";

    capNhatNutNhanHang(
        data
    );

}


/* =====================================================
   GOI APPS SCRIPT TIM DON
   ===================================================== */

function timDonTrenServer(maQR) {

    return new Promise(function(resolve, reject) {

        document.getElementById("thongBao").innerText =
            "Dang tim don " + maQR + "...";

        const tenCallback =
            "nhanKetQuaQR_" + Date.now();

        let script = null;
        let daXuLy = false;

        const url =
            URL_APPS_SCRIPT +
            "?action=timDon" +
            "&maQR=" +
            encodeURIComponent(maQR) +
            "&callback=" +
            encodeURIComponent(tenCallback);

        console.log("URL JSONP:");
        console.log(url);

        function donDep() {

            delete window[tenCallback];

            if (script && script.parentNode) {
                script.parentNode.removeChild(script);
            }

        }

        window[tenCallback] = function(data) {

            if (daXuLy) {
                return;
            }

            daXuLy = true;

            console.log(
                "Du lieu tu Apps Script:",
                data
            );

            donDep();

            if (data && data.ok) {

                hienThiDonHang(data);

                document.getElementById("thongBao").innerText =
                    "Da tim thay don: " + maQR;

                resolve(data);

            }
            else {

                document.getElementById("thongBao").innerText =
                    (data && data.msg) ||
                    "Khong tim thay don";

                resolve(
                    data || {
                        ok: false,
                        msg: "Khong co du lieu"
                    }
                );

            }

        };

        script =
            document.createElement("script");

        script.src = url;

        script.onload = function() {

            console.log(
                "JSONP script da tai xong"
            );

        };

        script.onerror = function() {

            if (daXuLy) {
                return;
            }

            daXuLy = true;

            donDep();

            console.error(
                "JSONP ERROR:",
                url
            );

            document.getElementById("thongBao").innerText =
                "Loi JSONP Apps Script";

            alert(
                "Apps Script khong tra ve JSONP.\n\n" +
                "Ma QR: " + maQR
            );

            reject(
                new Error(
                    "JSONP Apps Script error"
                )
            );

        };

        document.body.appendChild(script);

    });

}


/* =====================================================
   NHAN HANG
   ===================================================== */

function nhanHangTuApp() {

    if (
        !maQRHienTai
    ) {

        alert(
            "Chua co ma QR"
        );

        return;

    }


    if (
        !anhBase64
    ) {

        alert(
            "Chua co anh chup"
        );

        return;

    }


    const maNV =
        document.getElementById(
            "maNVNhap"
        ).value.trim();


    if (
        !maNV
    ) {

        alert(
            "Hay nhap ma nhan vien"
        );

        return;

    }


    const nut =
        document.getElementById(
            "btnNhanHang"
        );


    nut.disabled =
        true;


    document.getElementById(
        "thongBao"
    ).innerText =
        "Dang gui yeu cau nhan hang...";


    document.getElementById(
        "guiHanhDong"
    ).value =
        "NHAN";


    document.getElementById(
        "guiMaQR"
    ).value =
        maQRHienTai;


    document.getElementById(
        "guiMaNV"
    ).value =
        maNV;


    document.getElementById(
        "guiAnhBase64"
    ).value =
        anhBase64;


    document.getElementById(
        "formNhanHang"
    ).submit();


    setTimeout(
        function() {

            document.getElementById(
                "thongBao"
            ).innerText =
                "Dang kiem tra ket qua...";


            timDonTrenServer(
                maQRHienTai
            )
            .then(
                function(data) {

                    if (
                        data.ok &&
                        data.trangThai ===
                        "DANG_GIAO"
                    ) {

                        document.getElementById(
                            "thongBao"
                        ).innerText =
                            "DA NHAN HANG THANH CONG";


                        capNhatNutNhanHang(
                            data
                        );

                    }
                    else {

                        document.getElementById(
                            "thongBao"
                        ).innerText =
                            data.msg ||
                            "Nhan hang chua thanh cong";


                        nut.disabled =
                            false;

                    }

                }
            )
            .catch(
                function(err) {

                    console.log(err);


                    document.getElementById(
                        "thongBao"
                    ).innerText =
                        "Khong xac nhan duoc ket qua";


                    nut.disabled =
                        false;

                }
            );

        },
        2500
    );

}


/* =====================================================
   MO CAMERA
   ===================================================== */

async function moCamera() {

    try {

        document.getElementById(
            "thongBao"
        ).innerText =
            "Dang mo camera...";


        html5QrCode =
            new Html5Qrcode(
                "reader"
            );


        const cameras =
            await Html5Qrcode.getCameras();


        if (
            !cameras ||
            cameras.length === 0
        ) {

            throw new Error(
                "Khong tim thay camera"
            );

        }


        let cameraId =
            cameras[0].id;


        for (
            let camera of cameras
        ) {

            const ten =
                String(
                    camera.label || ""
                ).toLowerCase();


            if (
                ten.includes("back") ||
                ten.includes("rear") ||
                ten.includes("environment")
            ) {

                cameraId =
                    camera.id;

                break;

            }

        }


        await html5QrCode.start(

            cameraId,

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }
            },

            xuLyQR,

            function(errorMessage) {
                // Bo qua loi quet lien tuc
            }

        );


        document.getElementById(
            "thongBao"
        ).innerText =
            "Dua QR vao khung de quet";

    }
    catch(e) {

        console.error(e);


        document.getElementById(
            "thongBao"
        ).innerText =
            "LOI CAMERA: " +
            e.message;

    }

}


/* =====================================================
   XU LY QR
   ===================================================== */

async function xuLyQR(
    maQR
) {

    if (
        daQuet
    ) {

        return;

    }


    daQuet =
        true;


    maQR =
        String(
            maQR
        ).trim();


    maQRHienTai =
        maQR;


    bipQuetQR();


    document.getElementById(
        "thongBao"
    ).innerText =
        "Da quet QR: " +
        maQR;


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                300
            )
    );


    /* =================================================
       TU CHUP ANH
       ================================================= */

    try {

        const reader =
            document.getElementById(
                "reader"
            );


        const video =
            reader.querySelector(
                "video"
            );


        if (!video) {

            throw new Error(
                "Khong tim thay video camera"
            );

        }


        const canvas =
            document.createElement(
                "canvas"
            );


        const maxWidth =
            1280;


        let width =
            video.videoWidth;


        let height =
            video.videoHeight;


        if (
            width > maxWidth
        ) {

            height =
                Math.round(
                    height *
                    maxWidth /
                    width
                );

            width =
                maxWidth;

        }


        canvas.width =
            width;


        canvas.height =
            height;


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.drawImage(
            video,
            0,
            0,
            width,
            height
        );


        const anh =
            canvas.toDataURL(
                "image/jpeg",
                0.75
            );


        if (
            anh
        ) {

            anhBase64 =
                anh;


            bipChupAnh();


            const anhXem =
                document.getElementById(
                    "anhXem"
                );


            anhXem.src =
                anh;


            anhXem.style.display =
                "block";


            document.getElementById(
                "thongBao"
            ).innerText =
                "Da quet va tu chup anh: " +
                maQR;

        }

    }
    catch(e) {

        console.error(e);


        document.getElementById(
            "thongBao"
        ).innerText =
            "Quet duoc QR nhung khong chup duoc anh";

    }


    await dungCamera();


    /* =================================================
       GOI APPS SCRIPT
       ================================================= */

    await timDonTrenServer(
        maQR
    );

}


/* =====================================================
   DUNG CAMERA
   ===================================================== */

async function dungCamera() {

    try {

        if (
            html5QrCode
        ) {

            await html5QrCode.stop();

            await html5QrCode.clear();

        }

    }
    catch(e) {

        console.log(
            "Loi dung camera:",
            e
        );

    }

}


/* =====================================================
   CHUP LAI
   ===================================================== */

async function chupLai() {

    document.getElementById(
        "anhXem"
    ).style.display =
        "none";


    document.getElementById(
        "thongBao"
    ).innerText =
        "Dang mo camera de chup lai...";


    await moCameraChoChupLai();

}


/* =====================================================
   MO CAMERA CHUP LAI
   ===================================================== */

async function moCameraChoChupLai() {

    try {

        html5QrCode =
            new Html5Qrcode(
                "reader"
            );


        const cameras =
            await Html5Qrcode.getCameras();


        let cameraId =
            cameras[0].id;


        for (
            let camera of cameras
        ) {

            const ten =
                String(
                    camera.label || ""
                ).toLowerCase();


            if (
                ten.includes("back") ||
                ten.includes("rear") ||
                ten.includes("environment")
            ) {

                cameraId =
                    camera.id;

                break;

            }

        }


        await html5QrCode.start(

            cameraId,

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }
            },

            async function(
                maQR
            ) {

                try {

                    const reader =
                        document.getElementById(
                            "reader"
                        );


                    const video =
                        reader.querySelector(
                            "video"
                        );


                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                300
                            )
                    );


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    let width =
                        video.videoWidth;


                    let height =
                        video.videoHeight;


                    const maxWidth =
                        1280;


                    if (
                        width > maxWidth
                    ) {

                        height =
                            Math.round(
                                height *
                                maxWidth /
                                width
                            );

                        width =
                            maxWidth;

                    }


                    canvas.width =
                        width;


                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        video,
                        0,
                        0,
                        width,
                        height
                    );


                    anhBase64 =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.75
                        );


                    document.getElementById(
                        "anhXem"
                    ).src =
                        anhBase64;


                    document.getElementById(
                        "anhXem"
                    ).style.display =
                        "block";


                    bipChupAnh();


                    document.getElementById(
                        "thongBao"
                    ).innerText =
                        "Da chup lai anh";


                    await dungCamera();

                }
                catch(e) {

                    console.error(e);

                }

            },

            function(
                errorMessage
            ) {}

        );

    }
    catch(e) {

        document.getElementById(
            "thongBao"
        ).innerText =
            "LOI CAMERA: " +
            e.message;

    }

}


/* =====================================================
   QUET QR MOI
   ===================================================== */

async function quetMoi() {

    await dungCamera();


    daQuet =
        false;


    maQRHienTai =
        "";


    anhBase64 =
        "";


    document.getElementById(
        "anhXem"
    ).src =
        "";


    document.getElementById(
        "anhXem"
    ).style.display =
        "none";


    document.getElementById(
        "thongTinDon"
    ).style.display =
        "none";


    document.getElementById(
        "khuNhanHang"
    ).style.display =
        "none";


    document.getElementById(
        "btnNhanHang"
    ).disabled =
        true;


    document.getElementById(
        "thongBao"
    ).innerText =
        "Dang mo camera...";


    await moCamera();

}


/* =====================================================
   TU DONG MO CAMERA
   ===================================================== */

window.onload =
    function() {

        moCamera();

    };

</script>

</body>

</html>
