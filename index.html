<!-- =====================================================
     THU VIEN QR
     ===================================================== -->

<script src="https://unpkg.com/html5-qrcode"></script>


<script>

/* =====================================================
   CAU HINH
   ===================================================== */

const URL_APP =
"https://script.google.com/macros/s/AKfycbxeQSO_DE18GmlRidLJNF4oMs4T7bQ2u1SyERrHtQgJm2cPgkickHyKxh_AbmI0k-Fi8w/exec";


/* =====================================================
   BIEN
   ===================================================== */

let audioContext = null;

let html5QrCode = null;

let dangChay = false;

let daQuet = false;

let anhBase64 = "";

let maQRHienTai = "";

let maNVHienTai = "";

let tenNVHienTai = "";

let thaoTacHienTai = "";


/* =====================================================
   TAO TIENG BIP
   ===================================================== */

function taoTiengBip(tanSo, thoiGian, amLuong) {

    try {

        if (!audioContext) {

            audioContext =
                new (window.AudioContext ||
                     window.webkitAudioContext)();
        }

        if (audioContext.state === "suspended") {

            audioContext.resume();
        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = "square";

        oscillator.frequency.value =
            tanSo;

        gain.gain.value =
            amLuong;

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            thoiGian
        );

    }
    catch(e) {

        console.log(
            "Khong phat duoc tieng bip:",
            e
        );
    }
}


/* =====================================================
   BIP QR
   ===================================================== */

function bipQuetQR() {

    taoTiengBip(
        1000,
        0.35,
        0.8
    );
}


/* =====================================================
   BIP CHUP ANH
   ===================================================== */

function bipChupAnh() {

    taoTiengBip(
        1500,
        0.20,
        0.8
    );
}


/* =====================================================
   DANG NHAP
   ===================================================== */

function dangNhapApp() {

    const maNV =
        document.getElementById("maNV")
        .value.trim();

    const matKhau =
        document.getElementById("matKhau")
        .value.trim();

    if (!maNV || !matKhau) {

        alert(
            "Hay nhap ma nhan vien va mat khau"
        );

        return;
    }

    document.getElementById(
        "ketQuaDangNhap"
    ).innerHTML =
        "Dang dang nhap...";

    goiJSONP(
        "dangNhap",
        {
            maNV: maNV,
            matKhau: matKhau
        },
        function(kq) {

            if (!kq || !kq.ok) {

                document.getElementById(
                    "ketQuaDangNhap"
                ).innerHTML =
                    kq && kq.msg
                    ? kq.msg
                    : "Dang nhap that bai";

                return;
            }

            maNVHienTai =
                kq.maNV;

            tenNVHienTai =
                kq.tenNV;

            document.getElementById(
                "nvHienTai"
            ).innerHTML =
                "Nhan vien: " +
                tenNVHienTai +
                " (" +
                maNVHienTai +
                ")";

            document.getElementById(
                "khungDangNhap"
            ).style.display = "none";

            document.getElementById(
                "khungMenu"
            ).style.display = "block";

        }
    );
}


/* =====================================================
   JSONP
   ===================================================== */

function goiJSONP(
    action,
    thamSo,
    callback
) {

    const tenCallback =
        "callback_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random() * 10000
        );

    window[tenCallback] =
        function(duLieu) {

            try {

                callback(duLieu);

            }
            finally {

                delete window[tenCallback];

                if (script.parentNode) {

                    script.parentNode.removeChild(
                        script
                    );
                }
            }
        };

    const script =
        document.createElement("script");

    let url =
        URL_APP +
        "?action=" +
        encodeURIComponent(action) +
        "&callback=" +
        encodeURIComponent(tenCallback);

    for (const ten in thamSo) {

        url +=
            "&" +
            encodeURIComponent(ten) +
            "=" +
            encodeURIComponent(
                thamSo[ten] || ""
            );
    }

    script.src = url;

    script.onerror = function() {

        delete window[tenCallback];

        document.getElementById(
            "ketQua"
        ).innerHTML =
            "Khong ket noi duoc Google Sheet";

    };

    document.body.appendChild(script);
}


/* =====================================================
   CHON NHAN HANG
   ===================================================== */

function chonNhanHang() {

    thaoTacHienTai =
        "NHAN_HANG";

    moManHinhThaoTac(
        "NHAN HANG TU KHO"
    );
}


/* =====================================================
   CHON GIAO HANG
   ===================================================== */

function chonGiaoHang() {

    thaoTacHienTai =
        "GIAO_HANG";

    moManHinhThaoTac(
        "GIAO HANG"
    );

    document.getElementById(
        "khungThanhToan"
    ).style.display = "block";
}


/* =====================================================
   CHON HANG HOAN
   ===================================================== */

function chonHangHoan() {

    thaoTacHienTai =
        "HANG_HOAN";

    moManHinhThaoTac(
        "HANG HOAN"
    );

    document.getElementById(
        "khungLyDo"
    ).style.display = "block";
}


/* =====================================================
   CHON NHAP LAI KHO
   ===================================================== */

function chonNhapLaiKho() {

    thaoTacHienTai =
        "NHAP_LAI_KHO";

    moManHinhThaoTac(
        "NHAP LAI KHO"
    );
}


/* =====================================================
   MO MAN HINH THAO TAC
   ===================================================== */

function moManHinhThaoTac(
    tieuDe
) {

    document.getElementById(
        "khungMenu"
    ).style.display = "none";

    document.getElementById(
        "khungThaoTac"
    ).style.display = "block";

    document.getElementById(
        "tieuDeThaoTac"
    ).innerHTML =
        tieuDe;

    datLaiManHinh();

    moCamera();
}


/* =====================================================
   DAT LAI MAN HINH
   ===================================================== */

function datLaiManHinh() {

    maQRHienTai = "";

    anhBase64 = "";

    daQuet = false;

    document.getElementById(
        "maQR"
    ).innerText =
        "Chua quet";

    document.getElementById(
        "anhChup"
    ).src = "";

    document.getElementById(
        "anhChup"
    ).style.display =
        "none";

    document.getElementById(
        "nhanAnh"
    ).style.display =
        "none";

    document.getElementById(
        "thongTinDon"
    ).style.display =
        "none";

    document.getElementById(
        "khungThanhToan"
    ).style.display =
        "none";

    document.getElementById(
        "khungLyDo"
    ).style.display =
        "none";

    document.getElementById(
        "lyDo"
    ).value = "";

    document.getElementById(
        "ketQua"
    ).innerHTML =
        "Hay dua ma QR vao khung camera.";

    document.getElementById(
        "trangThai"
    ).innerHTML =
        "San sang quet QR";
}


/* =====================================================
   MO CAMERA
   ===================================================== */

function moCamera() {

    if (dangChay) {

        return;
    }

    daQuet = false;

    document.getElementById(
        "trangThai"
    ).innerHTML =
        "Dang tim camera...";

    Html5Qrcode.getCameras()

    .then(function(cameras) {

        if (!cameras ||
            cameras.length === 0) {

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Khong tim thay camera";

            return;
        }

        let cameraId =
            cameras[0].id;

        /* Uu tien camera sau */

        for (
            let i = 0;
            i < cameras.length;
            i++
        ) {

            let ten =
                (
                    cameras[i].label ||
                    ""
                ).toLowerCase();

            if (
                ten.includes("back") ||
                ten.includes("rear") ||
                ten.includes("environment") ||
                ten.includes("sau")
            ) {

                cameraId =
                    cameras[i].id;

                break;
            }
        }

        html5QrCode =
            new Html5Qrcode(
                "reader"
            );

        const cauHinh = {

            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        };

        html5QrCode.start(

            cameraId,

            cauHinh,

            function(maQR) {

                xuLyQR(maQR);

            },

            function(loi) {

                /* Bo qua loi quet tam thoi */

            }

        )

        .then(function() {

            dangChay = true;

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Camera dang hoat dong - dua QR vao khung";

        })

        .catch(function(err) {

            dangChay = false;

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Khong mo duoc camera";

            document.getElementById(
                "ketQua"
            ).innerHTML =
                String(err);

            console.log(err);
        });

    })

    .catch(function(err) {

        document.getElementById(
            "trangThai"
        ).innerHTML =
            "Khong duoc phep truy cap camera";

        document.getElementById(
            "ketQua"
        ).innerHTML =
            String(err);

        console.log(err);
    });
}


/* =====================================================
   XU LY QR
   ===================================================== */

function xuLyQR(maQR) {

    if (daQuet) {

        return;
    }

    daQuet = true;

    maQR =
        String(maQR).trim();

    maQRHienTai =
        maQR;

    bipQuetQR();

    document.getElementById(
        "maQR"
    ).innerText =
        maQR;

    document.getElementById(
        "trangThai"
    ).innerHTML =
        "Da quet QR - dang chup anh...";

    document.getElementById(
        "ketQua"
    ).innerHTML =
        "Ma QR: " + maQR;


    /*
       CHUP ANH TRUOC
       SAU DO MOI DUNG CAMERA
    */

    setTimeout(function() {

        chupAnhTuCamera(
            function(anh) {

                if (anh) {

                    anhBase64 =
                        anh;

                    bipChupAnh();

                    document.getElementById(
                        "anhChup"
                    ).src =
                        anh;

                    document.getElementById(
                        "anhChup"
                    ).style.display =
                        "block";

                    document.getElementById(
                        "nhanAnh"
                    ).style.display =
                        "block";

                }

                dungCamera();

                timDonSauKhiQuet();

            }
        );

    }, 300);
}


/* =====================================================
   CHUP ANH TU CAMERA
   ===================================================== */

function chupAnhTuCamera(
    callback
) {

    const reader =
        document.getElementById(
            "reader"
        );

    const video =
        reader.querySelector(
            "video"
        );

    if (!video) {

        callback("");

        return;
    }

    if (
        video.readyState <
        HTMLMediaElement.HAVE_CURRENT_DATA
    ) {

        setTimeout(
            function() {

                chupAnhTuCamera(
                    callback
                );

            },
            300
        );

        return;
    }

    const canvas =
        document.createElement(
            "canvas"
        );

    let width =
        video.videoWidth;

    let height =
        video.videoHeight;

    if (!width || !height) {

        callback("");

        return;
    }

    const maxWidth =
        1280;

    if (width > maxWidth) {

        const tyLe =
            maxWidth / width;

        width =
            maxWidth;

        height =
            Math.round(
                height * tyLe
            );
    }

    canvas.width =
        width;

    canvas.height =
        height;

    const ctx =
        canvas.getContext(
            "2d"
        );

    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );

    const anh =
        canvas.toDataURL(
            "image/jpeg",
            0.75
        );

    callback(anh);
}


/* =====================================================
   TIM DON SAU KHI QUET
   ===================================================== */

function timDonSauKhiQuet() {

    document.getElementById(
        "trangThai"
    ).innerHTML =
        "Dang tim thong tin don hang...";

    goiJSONP(

        "timDon",

        {
            maQR: maQRHienTai
        },

        function(don) {

            if (!don || !don.ok) {

                document.getElementById(
                    "trangThai"
                ).innerHTML =
                    "Khong tim thay don hang";

                document.getElementById(
                    "ketQua"
                ).innerHTML =
                    don && don.msg
                    ? don.msg
                    : "Khong tim thay ma QR";

                return;
            }

            hienThiDon(don);

        }
    );
}


/* =====================================================
   HIEN THI DON
   ===================================================== */

function hienThiDon(don) {

    let html = "";

    html +=
        "<b>Ma don:</b> " +
        (don.maDon || "") +
        "<br>";

    html +=
        "<b>Khach hang:</b> " +
        (don.khachHang || "") +
        "<br>";

    html +=
        "<b>Dien thoai:</b> " +
        (don.soDienThoai || "") +
        "<br>";

    html +=
        "<b>Dia chi:</b> " +
        (don.diaChi || "") +
        "<br>";

    html +=
        "<b>Ten hang:</b> " +
        (don.tenHang || "") +
        "<br>";

    html +=
        "<b>So luong:</b> " +
        (don.soLuong || 0) +
        "<br>";

    html +=
        "<b>Tien hang:</b> " +
        dinhDangTien(don.tienHang) +
        "<br>";

    html +=
        "<b>Tien ship:</b> " +
        dinhDangTien(don.tienShip) +
        "<br>";

    html +=
        "<b>Tong tien:</b> " +
        dinhDangTien(don.tongTien) +
        "<br>";

    html +=
        "<b>Trang thai:</b> " +
        (don.trangThai || "");

    document.getElementById(
        "thongTinDon"
    ).innerHTML =
        html;

    document.getElementById(
        "thongTinDon"
    ).style.display =
        "block";

    document.getElementById(
        "trangThai"
    ).innerHTML =
        "Da tim thay don hang";

    document.getElementById(
        "ketQua"
    ).innerHTML =
        "Kiem tra thong tin va bam XAC NHAN.";
}


/* =====================================================
   DINH DANG TIEN
   ===================================================== */

function dinhDangTien(
    soTien
) {

    const n =
        Number(soTien) || 0;

    return n.toLocaleString(
        "vi-VN"
    ) + " d";
}


/* =====================================================
   XAC NHAN THAO TAC
   ===================================================== */

function xacNhanThaoTac() {

    if (!maQRHienTai) {

        alert(
            "Hay quet ma QR truoc"
        );

        return;
    }

    if (!anhBase64 &&
        thaoTacHienTai !== "NHAP_LAI_KHO") {

        alert(
            "Chua co anh chup"
        );

        return;
    }


    if (
        thaoTacHienTai ===
        "NHAN_HANG"
    ) {

        guiNhanHang();

        return;
    }


    if (
        thaoTacHienTai ===
        "GIAO_HANG"
    ) {

        guiGiaoHang();

        return;
    }


    if (
        thaoTacHienTai ===
        "HANG_HOAN"
    ) {

        guiHangHoan();

        return;
    }


    if (
        thaoTacHienTai ===
        "NHAP_LAI_KHO"
    ) {

        guiNhapLaiKho();

        return;
    }
}


/* =====================================================
   GUI FORM POST
   ===================================================== */

function guiPOST(
    duLieu,
    callback
) {

    const iframe =
        document.createElement(
            "iframe"
        );

    iframe.name =
        "iframeGui_" +
        Date.now();

    iframe.style.display =
        "none";

    document.body.appendChild(
        iframe
    );

    const form =
        document.createElement(
            "form"
        );

    form.method =
        "POST";

    form.action =
        URL_APP;

    form.target =
        iframe.name;

    for (
        const ten in duLieu
    ) {

        const input =
            document.createElement(
                "input"
            );

        input.type =
            "hidden";

        input.name =
            ten;

        input.value =
            duLieu[ten] || "";

        form.appendChild(
            input
        );
    }

    document.body.appendChild(
        form
    );

    form.submit();

    setTimeout(
        function() {

            if (form.parentNode) {

                form.parentNode.removeChild(
                    form
                );
            }

            if (iframe.parentNode) {

                iframe.parentNode.removeChild(
                    iframe
                );
            }

            if (callback) {

                callback();
            }

        },
        1800
    );
}

/* =====================================================
   DUNG CAMERA
   ===================================================== */

function dungCamera() {

    if (
        !html5QrCode ||
        !dangChay
    ) {

        return;
    }

    html5QrCode.stop()

    .then(function() {

        try {

            html5QrCode.clear();

        }
        catch(e) {

            console.log(e);
        }

        dangChay =
            false;

    })

    .catch(function(err) {

        console.log(err);

        dangChay =
            false;

    });
}

    }

    document.getElementById(
        "trangThai"

    daQuet =

}


/* =====================================================
   MO CAMERA CHO CHUP LAI
   ===================================================== */

function moCameraChoChupLai() {

    if (dangChay) {

        return;
    }

    Html5Qrcode.getCameras()

    .then(function(cameras) {

        if (!cameras ||
            cameras.length === 0) {

            alert(
                "Khong tim thay camera"
            );

            return;
        }

        let cameraId =
            cameras[0].id;

        for (
            let i = 0;
            i < cameras.length;
            i++
        ) {

            let ten =
                (
                    cameras[i].label ||
                    ""
                ).toLowerCase();

            if (
                ten.includes("back") ||
                ten.includes("rear") ||
                ten.includes("environment") ||
                ten.includes("sau")
            ) {

                cameraId =
                    cameras[i].id;

                break;
            }
        }

        html5QrCode =
            new Html5Qrcode(
                "reader"
            );

        html5QrCode.start(

            cameraId,

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }
            },

            function() {},

            function() {}

        )

        .then(function() {

            dangChay =
                true;

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Camera dang hoat dong - dua may vao kien hang";

            setTimeout(
                function() {

                    chupAnhTuCamera(
                        function(anh) {

                            if (anh) {

                                anhBase64 =
                                    anh;

                                bipChupAnh();

                                document.getElementById(
                                    "anhChup"
                                ).src =
                                    anh;

                                document.getElementById(
                                    "anhChup"
                                ).style.display =
                                    "block";

                                document.getElementById(
                                    "nhanAnh"
                                ).style.display =
                                    "block";

                                document.getElementById(
                                    "trangThai"
                                ).innerHTML =
                                    "Da chup lai anh";
                            }

                            dungCamera();

                        }
                    );

                },
                1000
            );

        })

        .catch(function(err) {

            document.getElementById(
                "trangThai"
            ).innerHTML =
                "Khong mo duoc camera";

            console.log(err);

        });

    })

    .catch(function(err) {

        console.log(err);

    });
}
